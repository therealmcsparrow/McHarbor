name: Dev

# CI for the `dev` branch.
# Fast inner-loop. Every push runs the lightweight checks
# (go vet, tsc, build) and publishes a `:dev` image for the
# maintainer to pull into a local cluster. No version checks,
# no changelog gate, no deploy — that's what the next stages
# in the chain are for.
on:
  push:
    branches:
      - dev
  pull_request:
    branches:
      - dev
  workflow_dispatch:
    inputs:
      architectures:
        description: Architectures to build native packages for
        default: amd64
        type: string

permissions:
  contents: read
  packages: write
  id-token: write
  pull-requests: read

concurrency:
  group: dev-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build & verify
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Read versions
        id: versions
        shell: bash
        run: |
          app_version="$(tr -d '[:space:]' < VERSION)"
          dev_sha="${GITHUB_SHA::7}"
          echo "app_version=$app_version" >> "$GITHUB_OUTPUT"
          echo "dev_sha=$dev_sha" >> "$GITHUB_OUTPUT"

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.27.2'
          cache: true

      - name: Set up Node
        uses: actions/setup-node@v5
        with:
          node-version: '26'
          cache: 'npm'
          cache-dependency-path: src/frontend/package-lock.json

      - name: Go vet
        working-directory: src/backend
        run: go vet ./...

      - name: Go build
        working-directory: src/backend
        run: go build ./...

      - name: Agent build
        working-directory: src/agent
        run: go build ./...

      - name: Install npm dependencies
        working-directory: src/frontend
        run: npm ci --legacy-peer-deps

      - name: TypeScript check
        working-directory: src/frontend
        run: npx tsc -b

      - name: Frontend build
        working-directory: src/frontend
        run: npm run build

      - name: Prepare ruleguard DSL
        shell: bash
        run: |
          set -euo pipefail
          (cd scripts/lint/ruleguard && GOWORK=off go mod download)
          gopath="$(go env GOPATH)"
          dsl="$gopath/pkg/mod/github.com/quasilyte/go-ruleguard/dsl@v0.3.23"
          mkdir -p "$gopath/src/github.com/quasilyte/go-ruleguard/dsl"
          cp -r "$dsl"/. "$gopath/src/github.com/quasilyte/go-ruleguard/dsl/"
          GO111MODULE=off go install github.com/quasilyte/go-ruleguard/dsl

      - name: golangci-lint (backend)
        uses: golangci/golangci-lint-action@v9
        env:
          GOWORK: off
        with:
          version: v2.14.0
          install-mode: goinstall
          working-directory: src/backend
          only-new-issues: ${{ github.event_name == 'pull_request' }}

      - name: golangci-lint (agent)
        uses: golangci/golangci-lint-action@v9
        env:
          GOWORK: off
        with:
          version: v2.14.0
          install-mode: goinstall
          working-directory: src/agent
          only-new-issues: ${{ github.event_name == 'pull_request' }}

      - name: golangci-lint (cli)
        uses: golangci/golangci-lint-action@v9
        env:
          GOWORK: off
        with:
          version: v2.14.0
          install-mode: goinstall
          working-directory: src/cli
          only-new-issues: ${{ github.event_name == 'pull_request' }}

      - name: govulncheck
        shell: bash
        env:
          GOWORK: off
        run: |
          go install golang.org/x/vuln/cmd/govulncheck@latest
          status=0
          for dir in src/backend src/agent; do
            (cd "$dir" && "$(go env GOPATH)/bin/govulncheck" ./...) || status=1
          done
          exit "$status"

      - name: Lint (Oxlint) and format check
        working-directory: src/frontend
        run: npm run lint && npm run format:check

      - name: Unused files and exports (knip report)
        working-directory: src/frontend
        continue-on-error: true
        run: npm run knip:report

      - name: i18n keys resolve and locales are in sync
        run: |
          node scripts/sanity/i18n/verify-keys.mjs
          node scripts/sanity/i18n/sync-locales.mjs

      - name: i18n translation ratchet
        shell: pwsh
        run: ./scripts/sanity/i18n-untranslated/check.ps1 -Ratchet .instructions/sanity/baselines/i18n-untranslated-ratchet.json

      - name: Hook guardrail tests
        run: node --test scripts/hooks/__tests__/*.test.mjs

      - name: Sanity checks
        shell: pwsh
        run: ./scripts/sanity/run-all.ps1 -Check security,code-quality,modularity,ui-consistency,error-visualization,copyright,code-comments,go-standards,react-standards,permissions,plugin-host-coupling,plugin-isolation,duplication -FailOn fail -SkipNetwork

      - name: Upload sanity reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: sanity-reports
          path: .results/sanity/*
          if-no-files-found: ignore

      - name: gitleaks
        shell: bash
        run: |
          set -euo pipefail
          curl -sSfL https://github.com/gitleaks/gitleaks/releases/download/v8.30.1/gitleaks_8.30.1_linux_x64.tar.gz | tar -xz -C "$RUNNER_TEMP" gitleaks
          "$RUNNER_TEMP/gitleaks" detect --no-git -s src --config .gitleaks.toml --redact --verbose

  publish-dev-image:
    name: Publish dev image
    runs-on: ubuntu-latest
    needs: build
    if: github.event_name == 'push'
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Read versions
        id: versions
        shell: bash
        run: |
          app_version="$(tr -d '[:space:]' < VERSION)"
          dev_sha="${GITHUB_SHA::7}"
          echo "app_version=$app_version" >> "$GITHUB_OUTPUT"
          echo "dev_sha=$dev_sha" >> "$GITHUB_OUTPUT"

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Log in to GHCR
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.repository_owner }}
          password: ${{ secrets.GHCR_PAT || secrets.GITHUB_TOKEN }}

      - name: Build and push dev image
        uses: docker/build-push-action@v7
        with:
          context: .
          file: docker/Dockerfile
          platforms: linux/amd64
          push: true
          tags: |
            ghcr.io/${{ github.repository_owner }}/mcharbor:dev
            ghcr.io/${{ github.repository_owner }}/mcharbor:dev-${{ steps.versions.outputs.dev_sha }}
          labels: |
            org.opencontainers.image.version=${{ steps.versions.outputs.app_version }}
            org.opencontainers.image.source=https://github.com/${{ github.repository }}
            org.opencontainers.image.ref=dev

  publish-dev-agent:
    name: Publish dev agent
    runs-on: ubuntu-latest
    needs: build
    if: github.event_name == 'push'
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Read agent version
        id: version
        shell: bash
        run: |
          agent_version="$(sed -n 's/.*const agentVersion = "\(.*\)".*/\1/p' src/agent/agent.go | head -n1)"
          dev_sha="${GITHUB_SHA::7}"
          echo "agent_version=$agent_version" >> "$GITHUB_OUTPUT"
          echo "dev_sha=$dev_sha" >> "$GITHUB_OUTPUT"

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Log in to GHCR
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.repository_owner }}
          password: ${{ secrets.GHCR_PAT || secrets.GITHUB_TOKEN }}

      - name: Build and push dev agent
        uses: docker/build-push-action@v7
        with:
          context: .
          file: docker/Dockerfile.agent
          platforms: linux/amd64,linux/arm64
          push: true
          tags: |
            ghcr.io/${{ github.repository_owner }}/mcharbor-agent:dev
            ghcr.io/${{ github.repository_owner }}/mcharbor-agent:dev-${{ steps.version.outputs.dev_sha }}
          labels: |
            org.opencontainers.image.version=${{ steps.version.outputs.agent_version }}
            org.opencontainers.image.source=https://github.com/${{ github.repository }}
            org.opencontainers.image.ref=dev

  build-packages:
    name: Build native packages
    runs-on: ubuntu-latest
    needs: build
    if: github.event_name == 'workflow_dispatch'
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Read version
        id: versions
        shell: bash
        run: echo "app_version=$(tr -d '[:space:]' < VERSION)" >> "$GITHUB_OUTPUT"

      - name: Build glibc payload and tarball
        run: MCHARBOR_TARBALL=1 bash scripts/development/build-mcharbor.sh


      - name: Package deb and rpm
        env:
          MCHARBOR_VERSION: ${{ steps.versions.outputs.app_version }}
          MCHARBOR_ARCH: amd64
          MCHARBOR_PAYLOAD: dist/payload
        run: |
          mkdir -p dist/packages
          for pkg in deb rpm; do
            docker run --rm -v "$PWD:/w" -w /w \
              -e MCHARBOR_VERSION -e MCHARBOR_ARCH -e MCHARBOR_PAYLOAD \
              goreleaser/nfpm:v2.47.0 package -f packaging/nfpm.yaml -p "$pkg" -t dist/packages
          done

      - name: Generate checksums
        working-directory: dist/packages
        run: sha256sum * > SHA256SUMS

      - name: Upload packages
        uses: actions/upload-artifact@v4
        with:
          name: mcharbor-packages-amd64
          path: dist/packages/*
          retention-days: 30
