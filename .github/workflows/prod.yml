name: Prod

# Production deployment.
# This workflow runs ONLY on the `main` branch and is the final
# step in the dev -> test -> alpha -> beta -> release -> main
# promotion chain. It builds and publishes the production images
# to GHCR and creates a GitHub release from the CHANGELOG entry.
on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: write
  packages: write
  id-token: write

jobs:
  publish-mcharbor:
    runs-on: ubuntu-latest
    outputs:
      app_version: ${{ steps.versions.outputs.app_version }}
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Read versions
        id: versions
        shell: bash
        run: |
          app_version="$(tr -d '[:space:]' < VERSION)"
          agent_version="$(sed -n 's/.*const agentVersion = "\(.*\)".*/\1/p' src/agent/agent.go | head -n1)"
          frontend_version="$(sed -n 's/.*"version": "\(.*\)".*/\1/p' src/frontend/package.json | head -n1)"
          echo "app_version=$app_version" >> "$GITHUB_OUTPUT"
          echo "agent_version=$agent_version" >> "$GITHUB_OUTPUT"
          echo "frontend_version=$frontend_version" >> "$GITHUB_OUTPUT"
          if [[ "$agent_version" != "$app_version" || "$frontend_version" != "$app_version" ]]; then
            echo "::error::Version drift detected. VERSION=$app_version, agent=$agent_version, frontend=$frontend_version."
            exit 1
          fi

      - name: Verify CHANGELOG entry
        shell: bash
        run: |
          set -euo pipefail
          version="$(tr -d '[:space:]' < VERSION)"
          if ! grep -q "^## \[${version}\]" CHANGELOG.md; then
            echo "::error::No CHANGELOG entry found for version ${version}. Add '## [${version}] - <date>' to CHANGELOG.md before pushing to main."
            exit 1
          fi
          echo "CHANGELOG entry found for ${version}."

      - name: Verify build
        working-directory: src/backend
        run: go build ./...

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Log in to GHCR
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.repository_owner }}
          password: ${{ secrets.GHCR_PAT || secrets.GITHUB_TOKEN }}

      - name: Extract mcharbor metadata
        id: meta
        uses: docker/metadata-action@v6
        with:
          images: ghcr.io/${{ github.repository_owner }}/mcharbor
          tags: |
            type=raw,value=${{ steps.versions.outputs.app_version }}
            type=raw,value=latest

      - name: Build and push mcharbor
        uses: docker/build-push-action@v7
        with:
          context: .
          file: docker/Dockerfile
          platforms: linux/amd64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: |
            ${{ steps.meta.outputs.labels }}
            org.opencontainers.image.version=${{ steps.versions.outputs.app_version }}
            org.opencontainers.image.source=https://github.com/${{ github.repository }}

  publish-agent:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Read agent version
        id: version
        shell: bash
        run: |
          agent_version="$(sed -n 's/.*const agentVersion = "\(.*\)".*/\1/p' src/agent/agent.go | head -n1)"
          echo "agent_version=$agent_version" >> "$GITHUB_OUTPUT"

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Log in to GHCR
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.repository_owner }}
          password: ${{ secrets.GHCR_PAT || secrets.GITHUB_TOKEN }}

      - name: Extract agent metadata
        id: meta
        uses: docker/metadata-action@v6
        with:
          images: ghcr.io/${{ github.repository_owner }}/mcharbor-agent
          tags: |
            type=raw,value=${{ steps.version.outputs.agent_version }}
            type=raw,value=latest

      - name: Build and push mcharbor-agent
        uses: docker/build-push-action@v7
        with:
          context: .
          file: docker/Dockerfile.agent
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: |
            ${{ steps.meta.outputs.labels }}
            org.opencontainers.image.version=${{ steps.version.outputs.agent_version }}
            org.opencontainers.image.source=https://github.com/${{ github.repository }}

  create-release:
    runs-on: ubuntu-latest
    needs: [publish-mcharbor, publish-agent]
    permissions:
      contents: write
    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Extract version from commit message
        id: version
        shell: bash
        run: |
          commit_msg="$(git log -1 --pretty=%s HEAD)"
          echo "Commit message: $commit_msg"
          if [[ "$commit_msg" =~ ^Release\ ([0-9]+\.[0-9]+\.[0-9]+) ]]; then
            version="${BASH_REMATCH[1]}"
            echo "version=$version" >> "$GITHUB_OUTPUT"
            echo "tag=v$version" >> "$GITHUB_OUTPUT"
            echo "Release detected: $version"
          else
            echo "version=" >> "$GITHUB_OUTPUT"
            echo "tag=" >> "$GITHUB_OUTPUT"
            echo "No release version detected; skipping GitHub release."
          fi

      - name: Create GitHub release
        if: steps.version.outputs.version != ''
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        shell: bash
        run: |
          version="${{ steps.version.outputs.version }}"
          tag="${{ steps.version.outputs.tag }}"

          if gh release view "$tag" >/dev/null 2>&1; then
            echo "Release $tag already exists; skipping."
            exit 0
          fi

          notes="$(awk -v ver="## [${version}]" '
            $0 ~ ver {flag=1; next}
            flag && /^## \[/ {flag=0}
            flag {print}
          ' CHANGELOG.md)"

          if [[ -z "$notes" ]]; then
            notes="Release $version"
          fi

          gh release create "$tag" \
            --title "Release $version" \
            --notes "$notes" \
            --target main
