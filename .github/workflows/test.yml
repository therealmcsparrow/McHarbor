name: Test

# CI for the `test` branch.
# Runs on every push and PR targeting test. Deploys the test image
# to the test environment when the build is green. The test image
# is tagged with the test branch's short SHA and `:test` for stable
# pulls from the test cluster.
on:
  push:
    branches:
      - test
  pull_request:
    branches:
      - test
  workflow_dispatch:
    inputs:
      architectures:
        description: Architectures to build native packages for
        default: amd64
        type: string

permissions:
  contents: read
  packages: write
  id-token: write
  pull-requests: read

concurrency:
  group: test-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build & verify
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Read versions
        id: versions
        shell: bash
        run: |
          app_version="$(tr -d '[:space:]' < VERSION)"
          agent_version="$(sed -n 's/.*const agentVersion = "\(.*\)".*/\1/p' src/agent/agent.go | head -n1)"
          test_sha="${GITHUB_SHA::7}"
          echo "app_version=$app_version" >> "$GITHUB_OUTPUT"
          echo "agent_version=$agent_version" >> "$GITHUB_OUTPUT"
          echo "test_sha=$test_sha" >> "$GITHUB_OUTPUT"

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.27.2'
          cache: true

      - name: Set up Node
        uses: actions/setup-node@v5
        with:
          node-version: '26'
          cache: 'npm'
          cache-dependency-path: src/frontend/package-lock.json

      - name: Verify Go build
        working-directory: src/backend
        run: go build ./...

      - name: Verify Go vet
        working-directory: src/backend
        run: go vet ./...

      - name: Permission and route contract
        working-directory: src/backend
        run: go test ./core/rbac/ ./core/apispec/ ./api/

      - name: OpenAPI document is current
        working-directory: src/backend
        shell: bash
        run: |
          set -euo pipefail
          DATA_DIR="$(mktemp -d)" MCHARBOR_EMIT_OPENAPI="$PWD/api/openapi.json" go run .
          if [[ -n "$(git status --porcelain -- api/openapi.json api/unrecorded-routes.txt)" ]]; then
            echo "::error::src/backend/api/openapi.json is stale. Regenerate: cd src/backend && DATA_DIR=\$(mktemp -d) MCHARBOR_EMIT_OPENAPI=api/openapi.json go run ."
            git diff --stat -- api/openapi.json || true
            exit 1
          fi

      - name: OpenAPI document is valid
        run: npx -y @redocly/cli@2 lint --extends=minimal src/backend/api/openapi.json

      - name: Terraform provider matches the current spec
        working-directory: src/terraform-provider-mcharbor
        shell: bash
        env:
          GOWORK: 'off'
        run: |
          set -euo pipefail
          go generate ./...
          if [[ -n "$(git status --porcelain -- .)" ]]; then
            echo "::error::src/terraform-provider-mcharbor generated code is stale. Run: cd src/terraform-provider-mcharbor && GOWORK=off go generate ./..."
            git status --porcelain -- .
            exit 1
          fi
          go vet ./...
          go test ./...

      - name: mcharbor CLI matches the current spec
        working-directory: src/cli
        shell: bash
        env:
          GOWORK: 'off'
        run: |
          set -euo pipefail
          go generate ./...
          if [[ -n "$(git status --porcelain -- .)" ]]; then
            echo "::error::src/cli generated code is stale. Run: cd src/cli && GOWORK=off go generate ./..."
            git status --porcelain -- .
            exit 1
          fi
          go vet ./...
          go test ./...
          CGO_ENABLED=0 go build -o /dev/null .

      - name: OpenAPI document generates a Go client
        shell: bash
        run: |
          set -euo pipefail
          spec="$GITHUB_WORKSPACE/src/backend/api/openapi.json"
          work="$(mktemp -d)"
          cd "$work"
          go mod init example.com/mcharborclient
          mkdir client
          printf 'package: client\noutput: client/client.gen.go\ngenerate:\n  client: true\n  models: true\n' > cfg.yaml
          go run github.com/oapi-codegen/oapi-codegen/v2/cmd/oapi-codegen@v2.5.0 -config cfg.yaml "$spec"
          go mod tidy
          go build ./...

      - name: Verify Agent build
        working-directory: src/agent
        run: go build ./...

      - name: Install npm dependencies
        working-directory: src/frontend
        run: npm ci --legacy-peer-deps

      - name: Verify TypeScript build
        working-directory: src/frontend
        run: npx tsc -b

      - name: Frontend tests
        working-directory: src/frontend
        run: npm test

      - name: Verify frontend build
        working-directory: src/frontend
        run: npm run build

      - name: Prepare ruleguard DSL
        shell: bash
        run: |
          set -euo pipefail
          (cd scripts/lint/ruleguard && GOWORK=off go mod download)
          gopath="$(go env GOPATH)"
          dsl="$gopath/pkg/mod/github.com/quasilyte/go-ruleguard/dsl@v0.3.23"
          mkdir -p "$gopath/src/github.com/quasilyte/go-ruleguard/dsl"
          cp -r "$dsl"/. "$gopath/src/github.com/quasilyte/go-ruleguard/dsl/"
          GO111MODULE=off go install github.com/quasilyte/go-ruleguard/dsl

      - name: golangci-lint (backend)
        uses: golangci/golangci-lint-action@v9
        env:
          GOWORK: off
        with:
          version: v2.14.0
          install-mode: goinstall
          working-directory: src/backend
          only-new-issues: ${{ github.event_name == 'pull_request' }}

      - name: golangci-lint (agent)
        uses: golangci/golangci-lint-action@v9
        env:
          GOWORK: off
        with:
          version: v2.14.0
          install-mode: goinstall
          working-directory: src/agent
          only-new-issues: ${{ github.event_name == 'pull_request' }}

      - name: golangci-lint (cli)
        uses: golangci/golangci-lint-action@v9
        env:
          GOWORK: off
        with:
          version: v2.14.0
          install-mode: goinstall
          working-directory: src/cli
          only-new-issues: ${{ github.event_name == 'pull_request' }}

      - name: govulncheck
        shell: bash
        env:
          GOWORK: off
        run: |
          go install golang.org/x/vuln/cmd/govulncheck@latest
          status=0
          for dir in src/backend src/agent; do
            (cd "$dir" && "$(go env GOPATH)/bin/govulncheck" ./...) || status=1
          done
          exit "$status"

      - name: Lint (Oxlint) and format check
        working-directory: src/frontend
        run: npm run lint && npm run format:check

      - name: Unused files and exports (knip report)
        working-directory: src/frontend
        continue-on-error: true
        run: npm run knip:report

      - name: i18n keys resolve and locales are in sync
        run: |
          node scripts/sanity/i18n/verify-keys.mjs
          node scripts/sanity/i18n/sync-locales.mjs

      - name: i18n translation ratchet
        shell: pwsh
        run: ./scripts/sanity/i18n-untranslated/check.ps1 -Ratchet .instructions/sanity/baselines/i18n-untranslated-ratchet.json

      - name: Hook guardrail tests
        run: node --test scripts/hooks/__tests__/*.test.mjs

      - name: Sanity checks
        shell: pwsh
        run: ./scripts/sanity/run-all.ps1 -Check security,code-quality,modularity,ui-consistency,error-visualization,copyright,code-comments,go-standards,react-standards,permissions,plugin-host-coupling,plugin-isolation,duplication -FailOn fail -SkipNetwork

      - name: Upload sanity reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: sanity-reports
          path: .results/sanity/*
          if-no-files-found: ignore

      - name: gitleaks
        shell: bash
        run: |
          set -euo pipefail
          curl -sSfL https://github.com/gitleaks/gitleaks/releases/download/v8.30.1/gitleaks_8.30.1_linux_x64.tar.gz | tar -xz -C "$RUNNER_TEMP" gitleaks
          "$RUNNER_TEMP/gitleaks" detect --no-git -s src --config .gitleaks.toml --redact --verbose

      - name: Verify version lockstep
        shell: bash
        run: |
          set -euo pipefail
          version="$(tr -d '[:space:]' < VERSION)"
          agent_version="$(sed -n 's/.*const agentVersion = "\(.*\)".*/\1/p' src/agent/agent.go | head -n1)"
          frontend_version="$(sed -n 's/.*"version": "\(.*\)".*/\1/p' src/frontend/package.json | head -n1)"
          if [[ "$agent_version" != "$version" || "$frontend_version" != "$version" ]]; then
            echo "::error::Version drift detected. VERSION=$version, agent=$agent_version, frontend=$frontend_version."
            exit 1
          fi
          echo "All version sources match: $version"

  migrations:
    name: Migrations on all database backends
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_PASSWORD: test
          POSTGRES_DB: mcharbor
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U postgres" --health-interval 5s --health-timeout 5s --health-retries 20
      mysql:
        image: mysql:8.4
        env:
          MYSQL_ROOT_PASSWORD: test
          MYSQL_DATABASE: mcharbor
        ports: ['3306:3306']
        options: >-
          --health-cmd "mysqladmin ping -ptest --silent" --health-interval 5s --health-timeout 5s --health-retries 30
      mariadb:
        image: mariadb:11
        env:
          MARIADB_ROOT_PASSWORD: test
          MARIADB_DATABASE: mcharbor
        ports: ['3307:3306']
        options: >-
          --health-cmd "mariadb-admin ping -ptest --silent" --health-interval 5s --health-timeout 5s --health-retries 30
      mssql:
        image: mcr.microsoft.com/mssql/server:2022-latest
        env:
          ACCEPT_EULA: 'Y'
          MSSQL_SA_PASSWORD: Str0ng-McHarbor-2026
        ports: ['1433:1433']
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.27.2'
          cache: true

      # SQL Server has no usable health-cmd of its own: the image's sqlcmd path moved
      # between revisions, so the wait lives here and creates the database, which unlike
      # the other three backends cannot be created from an environment variable.
      - name: Wait for SQL Server and create the database
        env:
          SA_PASSWORD: Str0ng-McHarbor-2026
        run: |
          set -u
          sqlcmd() {
            docker run --rm --network host mcr.microsoft.com/mssql/server:2022-latest sh -lc \
              "for tool in /opt/mssql-tools18/bin/sqlcmd /opt/mssql-tools/bin/sqlcmd; do
                 [ -x \"\$tool\" ] && exec \"\$tool\" -C -S localhost,1433 -U sa -P '$SA_PASSWORD' -b -Q \"$1\"
               done; echo 'no sqlcmd in the image' >&2; exit 1"
          }
          for attempt in $(seq 1 40); do
            if sqlcmd "SELECT 1" >/dev/null 2>&1; then
              echo "SQL Server answered after ${attempt} attempts"
              break
            fi
            if [ "$attempt" -eq 40 ]; then
              echo "::error::SQL Server did not become ready"
              exit 1
            fi
            sleep 5
          done
          sqlcmd "IF DB_ID('mcharbor') IS NULL CREATE DATABASE mcharbor;"
          sqlcmd "ALTER DATABASE mcharbor SET READ_COMMITTED_SNAPSHOT ON WITH ROLLBACK IMMEDIATE;"

      - name: Migrate from empty on SQLite, PostgreSQL, MySQL, MariaDB and SQL Server
        working-directory: src/backend
        env:
          GOWORK: 'off'
          MCHARBOR_TEST_PG_DSN: postgres://postgres:test@localhost:5432/mcharbor?sslmode=disable
          MCHARBOR_TEST_MYSQL_DSN: root:test@tcp(localhost:3306)/mcharbor?parseTime=true&loc=UTC
          MCHARBOR_TEST_MARIADB_DSN: root:test@tcp(localhost:3307)/mcharbor?parseTime=true&loc=UTC
          MCHARBOR_TEST_MSSQL_DSN: sqlserver://sa:Str0ng-McHarbor-2026@localhost:1433?database=mcharbor&encrypt=disable
        run: go test ./core/db/ -run 'TestMigrate' -count=1 -v

      - name: Driver-dependent tests on every database backend
        working-directory: src/backend
        env:
          GOWORK: 'off'
          MCHARBOR_TEST_PG_DSN: postgres://postgres:test@localhost:5432/mcharbor?sslmode=disable
          MCHARBOR_TEST_MYSQL_DSN: root:test@tcp(localhost:3306)/mcharbor?parseTime=true&loc=UTC
          MCHARBOR_TEST_MARIADB_DSN: root:test@tcp(localhost:3307)/mcharbor?parseTime=true&loc=UTC
          MCHARBOR_TEST_MSSQL_DSN: sqlserver://sa:Str0ng-McHarbor-2026@localhost:1433?database=mcharbor&encrypt=disable
        run: go test -p 1 ./core/db/ ./core/sqldialect/ ./core/coordinator/ ./modules/cluster/ ./modules/environments/ ./core/instancebackup/ -count=1

  ha-failover:
    name: Active/passive failover on ${{ matrix.name }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: PostgreSQL 16
            image: postgres:16-alpine
            port: 5432
            health: pg_isready -U postgres
            driver: postgres
            dsn: postgres://postgres:test@localhost:15000/mcharbor?sslmode=disable
          - name: MySQL 8.4
            image: mysql:8.4
            port: 3306
            health: mysqladmin ping -ptest --silent
            driver: mysql
            dsn: root:test@tcp(localhost:15000)/mcharbor?parseTime=true&loc=UTC
          - name: MariaDB 11
            image: mariadb:11
            port: 3306
            health: mariadb-admin ping -ptest --silent
            driver: mysql
            dsn: root:test@tcp(localhost:15000)/mcharbor?parseTime=true&loc=UTC
          - name: SQL Server 2022
            image: mcr.microsoft.com/mssql/server:2022-latest
            port: 1433
            health: exit 0
            driver: mssql
            dsn: sqlserver://sa:Str0ng-McHarbor-2026@localhost:15000?database=mcharbor&encrypt=disable
    services:
      db:
        image: ${{ matrix.image }}
        env:
          ACCEPT_EULA: 'Y'
          MSSQL_SA_PASSWORD: Str0ng-McHarbor-2026
          POSTGRES_PASSWORD: test
          POSTGRES_DB: mcharbor
          MYSQL_ROOT_PASSWORD: test
          MYSQL_DATABASE: mcharbor
          MARIADB_ROOT_PASSWORD: test
          MARIADB_DATABASE: mcharbor
        ports: ['15000:${{ matrix.port }}']
        options: >-
          --health-cmd "${{ matrix.health }}" --health-interval 5s --health-timeout 5s --health-retries 30
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.27.2'
          cache: true

      - name: Wait for SQL Server and create the database
        if: matrix.driver == 'mssql'
        env:
          SA_PASSWORD: Str0ng-McHarbor-2026
        run: |
          set -u
          sqlcmd() {
            docker run --rm --network host mcr.microsoft.com/mssql/server:2022-latest sh -lc \
              "for tool in /opt/mssql-tools18/bin/sqlcmd /opt/mssql-tools/bin/sqlcmd; do
                 [ -x \"\$tool\" ] && exec \"\$tool\" -C -S localhost,15000 -U sa -P '$SA_PASSWORD' -b -Q \"$1\"
               done; echo 'no sqlcmd in the image' >&2; exit 1"
          }
          for attempt in $(seq 1 40); do
            if sqlcmd "SELECT 1" >/dev/null 2>&1; then
              echo "SQL Server answered after ${attempt} attempts"
              break
            fi
            if [ "$attempt" -eq 40 ]; then
              echo "::error::SQL Server did not become ready"
              exit 1
            fi
            sleep 5
          done
          sqlcmd "IF DB_ID('mcharbor') IS NULL CREATE DATABASE mcharbor;"
          sqlcmd "ALTER DATABASE mcharbor SET READ_COMMITTED_SNAPSHOT ON WITH ROLLBACK IMMEDIATE;"

      - name: Build the backend
        working-directory: src/backend
        env:
          GOWORK: 'off'
        run: go build -buildvcs=false -o "$RUNNER_TEMP/mcharbor" .

      - name: Two nodes, one active lock, kill and restart
        env:
          MCHARBOR_BIN: ${{ runner.temp }}/mcharbor
          HA_DB_DRIVER: ${{ matrix.driver }}
          HA_DB_DSN: ${{ matrix.dsn }}
        run: bash scripts/ha/failover-check.sh

  cli-e2e:
    name: mcharbor CLI against a real server
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.27.2'
          cache: true

      - name: Build the McHarbor image
        run: docker build -f docker/Dockerfile -t mcharbor-e2e:ci .

      - name: Start a throwaway McHarbor
        shell: bash
        run: |
          set -euo pipefail
          docker run -d --name mcharbor-e2e -p 18706:8705 \
            -e TLS_ENABLED=false -e ALLOWED_ORIGINS=http://localhost:18706 \
            -v /var/run/docker.sock:/var/run/docker.sock mcharbor-e2e:ci
          for i in $(seq 1 60); do
            curl -sf http://localhost:18706/api/health >/dev/null && exit 0
            sleep 3
          done
          docker logs mcharbor-e2e
          exit 1

      - name: Bootstrap an admin and two API keys
        shell: bash
        run: |
          set -euo pipefail
          B=http://localhost:18706
          PASS="E2e-$(openssl rand -hex 12)!"
          curl -sf -X POST $B/api/auth/setup -H 'Content-Type: application/json' -d "{\"username\":\"admin\",\"password\":\"$PASS\"}" >/dev/null
          curl -sf -c jar -X POST $B/api/auth/login -H 'Content-Type: application/json' -d "{\"username\":\"admin\",\"password\":\"$PASS\"}" >/dev/null
          mk() { curl -sf -b jar -X POST $B/api/api-keys -H 'Content-Type: application/json' -H 'X-Requested-With: XMLHttpRequest' -d "$1" | jq -r .data.key; }
          FULL=$(mk '{"name":"cli-e2e-full","scopes":["environments.view","containers.view","volumes.view","volumes.manage","volumes.delete","images.view","networks.view","audit.view"]}')
          NARROW=$(mk '{"name":"cli-e2e-narrow","scopes":["environments.view","volumes.view"]}')
          echo "::add-mask::$FULL"
          echo "::add-mask::$NARROW"
          {
            echo "MCHARBOR_E2E_URL=$B"
            echo "MCHARBOR_E2E_FULL_KEY=$FULL"
            echo "MCHARBOR_E2E_NARROW_KEY=$NARROW"
          } >> "$GITHUB_ENV"

      - name: Run the CLI end-to-end test
        working-directory: src/cli
        env:
          GOWORK: 'off'
        run: go test ./internal/cli/ -run TestE2EAgainstARealServer -count=1 -v

      - name: Tear down
        if: always()
        run: docker rm -f mcharbor-e2e || true

  publish-test-image:
    name: Publish test image
    runs-on: ubuntu-latest
    needs: [build, migrations, ha-failover]
    if: github.event_name == 'push'
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Read versions
        id: versions
        shell: bash
        run: |
          app_version="$(tr -d '[:space:]' < VERSION)"
          test_sha="${GITHUB_SHA::7}"
          echo "app_version=$app_version" >> "$GITHUB_OUTPUT"
          echo "test_sha=$test_sha" >> "$GITHUB_OUTPUT"

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Log in to GHCR
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.repository_owner }}
          password: ${{ secrets.GHCR_PAT || secrets.GITHUB_TOKEN }}

      - name: Build and push test image
        uses: docker/build-push-action@v7
        with:
          context: .
          file: docker/Dockerfile
          platforms: linux/amd64
          push: true
          tags: |
            ghcr.io/${{ github.repository_owner }}/mcharbor:test
            ghcr.io/${{ github.repository_owner }}/mcharbor:test-${{ steps.versions.outputs.test_sha }}
          labels: |
            org.opencontainers.image.version=${{ steps.versions.outputs.app_version }}
            org.opencontainers.image.source=https://github.com/${{ github.repository }}
            org.opencontainers.image.ref=test

      - name: Trigger test deploy
        if: success()
        shell: bash
        env:
          TEST_WEBHOOK_URL: ${{ secrets.TEST_DEPLOY_WEBHOOK }}
          TEST_SHA: ${{ steps.versions.outputs.test_sha }}
        run: |
          if [[ -z "$TEST_WEBHOOK_URL" ]]; then
            echo "TEST_DEPLOY_WEBHOOK not set; skipping deploy trigger."
            exit 0
          fi
          echo "Triggering test deploy for SHA $TEST_SHA"
          curl -fsS -X POST -H "Content-Type: application/json" \
            -d "{\"image\":\"ghcr.io/${{ github.repository_owner }}/mcharbor:test-$TEST_SHA\",\"sha\":\"$TEST_SHA\"}" \
            "$TEST_WEBHOOK_URL"

  publish-test-agent:
    name: Publish test agent
    runs-on: ubuntu-latest
    needs: build
    if: github.event_name == 'push'
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Read agent version
        id: version
        shell: bash
        run: |
          agent_version="$(sed -n 's/.*const agentVersion = "\(.*\)".*/\1/p' src/agent/agent.go | head -n1)"
          test_sha="${GITHUB_SHA::7}"
          echo "agent_version=$agent_version" >> "$GITHUB_OUTPUT"
          echo "test_sha=$test_sha" >> "$GITHUB_OUTPUT"

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Log in to GHCR
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.repository_owner }}
          password: ${{ secrets.GHCR_PAT || secrets.GITHUB_TOKEN }}

      - name: Build and push test agent
        uses: docker/build-push-action@v7
        with:
          context: .
          file: docker/Dockerfile.agent
          platforms: linux/amd64,linux/arm64
          push: true
          tags: |
            ghcr.io/${{ github.repository_owner }}/mcharbor-agent:test
            ghcr.io/${{ github.repository_owner }}/mcharbor-agent:test-${{ steps.version.outputs.test_sha }}
          labels: |
            org.opencontainers.image.version=${{ steps.version.outputs.agent_version }}
            org.opencontainers.image.source=https://github.com/${{ github.repository }}
            org.opencontainers.image.ref=test

  build-packages:
    name: Build native packages
    runs-on: ubuntu-latest
    needs: build
    if: github.event_name == 'workflow_dispatch'
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Read version
        id: versions
        shell: bash
        run: echo "app_version=$(tr -d '[:space:]' < VERSION)" >> "$GITHUB_OUTPUT"

      - name: Build glibc payload and tarball
        run: MCHARBOR_TARBALL=1 bash scripts/development/build-mcharbor.sh


      - name: Package deb and rpm
        env:
          MCHARBOR_VERSION: ${{ steps.versions.outputs.app_version }}
          MCHARBOR_ARCH: amd64
          MCHARBOR_PAYLOAD: dist/payload
        run: |
          mkdir -p dist/packages
          for pkg in deb rpm; do
            docker run --rm -v "$PWD:/w" -w /w \
              -e MCHARBOR_VERSION -e MCHARBOR_ARCH -e MCHARBOR_PAYLOAD \
              goreleaser/nfpm:v2.47.0 package -f packaging/nfpm.yaml -p "$pkg" -t dist/packages
          done

      - name: Generate checksums
        working-directory: dist/packages
        run: sha256sum * > SHA256SUMS

      - name: Upload packages
        uses: actions/upload-artifact@v4
        with:
          name: mcharbor-packages-amd64
          path: dist/packages/*
          retention-days: 30
