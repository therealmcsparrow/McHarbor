name: Release Notes

# Fires when a release tag is pushed (e.g. `git push origin v1.6.6`)
# and writes the matching section of CHANGELOG.md as the public
# release body on GitHub Releases. The job is idempotent: it
# creates the release if it doesn't exist yet and updates the body
# if it does, so a re-pushed tag or a post-hoc CHANGELOG edit both
# end up reflected in the published notes.
on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      tag:
        description: "Tag to update (e.g. v1.6.6). Leave empty to use the latest reachable tag."
        required: false
        type: string
      dry_run:
        description: "When true, only prints the body to the workflow log; the GitHub release is not touched. Useful for previewing the extract."
        required: false
        type: boolean
        default: false

permissions:
  contents: write

jobs:
  release-notes:
    name: Sync release body with CHANGELOG.md
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Resolve target tag
        id: tag
        shell: bash
        run: |
          set -euo pipefail
          # Prefer the workflow_dispatch input if provided, then fall
          # back to the tag that triggered the push event.
          # GITHUB_REF_NAME is `vX.Y.Z` for `push: tags: v*` events.
          if [[ -n "${{ inputs.tag }}" ]]; then
            tag="${{ inputs.tag }}"
          else
            tag="${GITHUB_REF_NAME:-}"
          fi
          if [[ -z "${tag:-}" ]]; then
            echo "::error::No tag resolved; set workflow_dispatch tag input or push a v* tag."
            exit 1
          fi
          # Strip leading 'v' so the version matches the CHANGELOG
          # heading, e.g. v1.6.6 -> 1.6.6.
          version="${tag#v}"
          echo "tag=${tag}" >> "$GITHUB_OUTPUT"
          echo "version=${version}" >> "$GITHUB_OUTPUT"

      - name: Verify VERSION file matches the tag
        shell: bash
        run: |
          set -euo pipefail
          version="${{ steps.tag.outputs.version }}"
          if [[ ! -f VERSION ]]; then
            echo "::error::VERSION file not found at repo root."
            exit 1
          fi
          repo_version="$(tr -d '[:space:]' < VERSION)"
          if [[ "$repo_version" != "$version" ]]; then
            echo "::error::VERSION file ($repo_version) does not match tag ($version). Update VERSION and re-push the tag."
            exit 1
          fi
          # Also verify the agent version stays in lockstep so a
          # single release tag describes both the server and the
          # agent. Drift here has caused bad releases in the past.
          agent_version="$(sed -n 's/.*const agentVersion = "\(.*\)".*/\1/p' src/agent/agent.go | head -n1)"
          frontend_version="$(sed -n 's/.*"version": "\(.*\)".*/\1/p' src/frontend/package.json | head -n1)"
          if [[ "$agent_version" != "$version" ]]; then
            echo "::error::src/agent/agent.go agentVersion ($agent_version) does not match tag ($version)."
            exit 1
          fi
          if [[ "$frontend_version" != "$version" ]]; then
            echo "::error::src/frontend/package.json version ($frontend_version) does not match tag ($version)."
            exit 1
          fi
          echo "All version sources match tag $version."

      - name: Extract CHANGELOG section for the version
        id: extract
        shell: bash
        run: |
          set -euo pipefail
          version="${{ steps.tag.outputs.version }}"
          if [[ ! -f CHANGELOG.md ]]; then
            echo "::error::CHANGELOG.md not found."
            exit 1
          fi
          # awk walks the file, starts printing when it sees the
          # matching `## [version]` heading, and stops at the next
          # `## [` heading. This captures every sub-section
          # (### Added / ### Changed / ### Fixed) of the target
          # version, in order.
          notes="$(awk -v ver="## [${version}]" '
            $0 ~ ver {flag=1; next}
            flag && /^## \[/ {flag=0}
            flag {print}
          ' CHANGELOG.md)"
          # Drop leading blank lines so the release body doesn't
          # start with whitespace.
          notes="$(printf '%s' "$notes" | sed -e '/./,$!d')"
          if [[ -z "$notes" ]]; then
            # Fail loudly instead of publishing a generic body:
            # the operator almost certainly forgot to add a
            # CHANGELOG entry, and a release without notes is worse
            # than a failed job they have to investigate.
            echo "::error::No CHANGELOG entry found for version ${version}. Add '## [${version}] - <date>' to CHANGELOG.md before tagging."
            exit 1
          fi
          echo "Extracted CHANGELOG section for $version ($(printf '%s' "$notes" | wc -l) lines, $(printf '%s' "$notes" | wc -c) bytes)."
          {
            echo "notes<<DELIM"
            printf '%s\n' "$notes"
            echo "DELIM"
          } >> "$GITHUB_OUTPUT"

      - name: Preview body in workflow log
        shell: bash
        run: |
          set -euo pipefail
          echo "----- BEGIN release body for ${{ steps.tag.outputs.tag }} -----"
          printf '%s\n' '${{ steps.extract.outputs.notes }}'
          echo "----- END release body -----"

      - name: Create or update the GitHub Release
        if: ${{ inputs.dry_run != true }}
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.tag.outputs.tag }}
          name: "Release ${{ steps.tag.outputs.version }}"
          body: ${{ steps.extract.outputs.notes }}
          # `action_type: auto` is the default and lets the action
          # decide between create / update based on whether the
          # release already exists, so a re-pushed tag or
          # workflow_dispatch rerun both update the body in place.
          action_type: auto
          # No artifacts — the GHCR images are published by the
          # separate publish-images workflow. Linking them here
          # would race with the image build and the link would
          # often be empty at the time this workflow runs.
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

