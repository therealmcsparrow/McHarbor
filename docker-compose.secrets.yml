services:
  mcharbor:
    environment:
      - BACKUP_ENCRYPTION_KEY_FILE=/run/secrets/mcharbor_backup_key
    secrets:
      - source: mcharbor_backup_key
        target: mcharbor_backup_key
        mode: 0400

secrets:
  mcharbor_backup_key:
    file: ${MCHARBOR_BACKUP_KEY_FILE:-./secrets/mcharbor_backup_key}
