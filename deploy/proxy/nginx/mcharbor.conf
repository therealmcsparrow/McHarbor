map $http_upgrade $mcharbor_connection {
    default upgrade;
    ''      '';
}

upstream mcharbor {
    server mcharbor-node-1:8705 max_fails=1 fail_timeout=15s;
    server mcharbor-node-2:8705 max_fails=1 fail_timeout=15s backup;
    keepalive 32;
}

server {
    listen 80;
    listen [::]:80;
    server_name mcharbor.example.com;

    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    server_name mcharbor.example.com;

    ssl_certificate     /etc/nginx/certs/fullchain.pem;
    ssl_certificate_key /etc/nginx/certs/privkey.pem;
    ssl_protocols       TLSv1.2 TLSv1.3;
    ssl_session_cache   shared:mcharbor_tls:10m;
    ssl_session_timeout 1d;

    client_max_body_size 0;
    client_body_timeout 3600s;

    location / {
        proxy_pass https://mcharbor;

        proxy_http_version 1.1;
        proxy_set_header Upgrade           $http_upgrade;
        proxy_set_header Connection        $mcharbor_connection;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host  $host;
        proxy_set_header X-Forwarded-Port  $server_port;

        proxy_ssl_verify      off;
        proxy_ssl_server_name on;
        proxy_ssl_protocols   TLSv1.2 TLSv1.3;

        proxy_request_buffering off;
        proxy_buffering         off;
        proxy_cache             off;

        proxy_connect_timeout 5s;
        proxy_send_timeout    3600s;
        proxy_read_timeout    3600s;

        proxy_next_upstream         error timeout http_502 http_503 non_idempotent;
        proxy_next_upstream_timeout 15s;
        proxy_next_upstream_tries   2;
    }
}
