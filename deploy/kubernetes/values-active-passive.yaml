mode: active-passive

replicaCount: 2

secrets:
  existingSecret: mcharbor-secrets

externalDatabase:
  driver: postgres
  existingSecret: mcharbor-database
  dsnKey: dsn

ha:
  pluginStore: database
  antiAffinity: soft
  updateStrategy: OnDelete

config:
  allowedOrigins: https://mcharbor.example.com

persistence:
  size: 5Gi
