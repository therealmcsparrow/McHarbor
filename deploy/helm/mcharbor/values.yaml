mode: single

replicaCount: 2

image:
  repository: ghcr.io/therealmcsparrow/mcharbor
  tag: ""
  pullPolicy: IfNotPresent

imagePullSecrets: []

nameOverride: ""
fullnameOverride: ""

clusterDomain: cluster.local

serviceAccount:
  create: true
  name: ""
  annotations: {}
  automountToken: false

config:
  logLevel: info
  logJSON: false
  tz: UTC
  allowedOrigins: ""
  trustedProxyCIDRs: ""
  selfSignedSANExtra: ""
  forceAgentTLS: true
  hstsMaxAge: 0

tls:
  enabled: true
  minVersion: "1.3"

secrets:
  existingSecret: ""
  mcharborSecret: ""
  encryptionKey: ""
  backupKey: ""
  keys:
    mcharborSecret: mcharbor-secret
    encryptionKey: encryption-key
    backupKey: backup-key

externalDatabase:
  driver: postgres
  existingSecret: ""
  dsnKey: dsn

ha:
  pluginStore: database
  antiAffinity: soft
  updateStrategy: OnDelete

persistence:
  enabled: true
  storageClass: ""
  accessModes:
    - ReadWriteOnce
  size: 10Gi
  annotations: {}

backupVolume:
  enabled: false
  existingClaim: ""
  storageClass: ""
  accessModes:
    - ReadWriteOnce
  size: 50Gi
  mountPath: /mnt/backup

extraCACerts:
  existingConfigMap: ""

docker:
  socket:
    enabled: false
    hostPath: /var/run/docker.sock
    groupId: ""

service:
  type: ClusterIP
  port: 8705
  annotations: {}

ingress:
  enabled: false
  className: ""
  annotations: {}
  hosts:
    - host: mcharbor.example.com
      paths:
        - path: /
          pathType: Prefix
  tls: []

pdb:
  enabled: true
  maxUnavailable: 1
  unhealthyPodEvictionPolicy: AlwaysAllow

podSecurityContext:
  runAsNonRoot: true
  runAsUser: 1000
  runAsGroup: 1000
  fsGroup: 1000
  fsGroupChangePolicy: OnRootMismatch
  seccompProfile:
    type: RuntimeDefault

securityContext:
  allowPrivilegeEscalation: false
  privileged: false
  readOnlyRootFilesystem: true
  capabilities:
    drop:
      - ALL

resources:
  requests:
    cpu: 250m
    memory: 512Mi
  limits:
    memory: 2Gi

probes:
  startup:
    periodSeconds: 10
    timeoutSeconds: 5
    failureThreshold: 60
  liveness:
    periodSeconds: 15
    timeoutSeconds: 5
    failureThreshold: 4
  readiness:
    periodSeconds: 5
    timeoutSeconds: 4
    failureThreshold: 2
    successThreshold: 1

terminationGracePeriodSeconds: 30

podAnnotations: {}
podLabels: {}
nodeSelector: {}
tolerations: []
affinity: {}
topologySpreadConstraints: []
priorityClassName: ""

extraEnv: []
extraVolumes: []
extraVolumeMounts: []
