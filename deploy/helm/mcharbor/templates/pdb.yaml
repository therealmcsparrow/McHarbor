{{- if and .Values.pdb.enabled (include "mcharbor.ha" .) }}
apiVersion: policy/v1
kind: PodDisruptionBudget
metadata:
  name: {{ include "mcharbor.fullname" . }}
  labels:
    {{- include "mcharbor.labels" . | nindent 4 }}
spec:
  maxUnavailable: {{ .Values.pdb.maxUnavailable }}
  {{- with .Values.pdb.unhealthyPodEvictionPolicy }}
  unhealthyPodEvictionPolicy: {{ . }}
  {{- end }}
  selector:
    matchLabels:
      {{- include "mcharbor.selectorLabels" . | nindent 6 }}
{{- end }}
