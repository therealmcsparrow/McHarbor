{{- if include "mcharbor.chartSecretWanted" . }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "mcharbor.fullname" . }}
  labels:
    {{- include "mcharbor.labels" . | nindent 4 }}
  annotations:
    helm.sh/resource-policy: keep
type: Opaque
data:
  {{- with .Values.secrets.mcharborSecret }}
  {{ $.Values.secrets.keys.mcharborSecret }}: {{ . | b64enc | quote }}
  {{- end }}
  {{- with .Values.secrets.encryptionKey }}
  {{ $.Values.secrets.keys.encryptionKey }}: {{ . | b64enc | quote }}
  {{- end }}
  {{- with .Values.secrets.backupKey }}
  {{ $.Values.secrets.keys.backupKey }}: {{ . | b64enc | quote }}
  {{- end }}
{{- end }}
