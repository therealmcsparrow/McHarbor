{{- if and .Values.backupVolume.enabled (not .Values.backupVolume.existingClaim) }}
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: {{ include "mcharbor.fullname" . }}-backup
  labels:
    {{- include "mcharbor.labels" . | nindent 4 }}
  annotations:
    helm.sh/resource-policy: keep
spec:
  accessModes:
    {{- toYaml .Values.backupVolume.accessModes | nindent 4 }}
  {{- with .Values.backupVolume.storageClass }}
  storageClassName: {{ . | quote }}
  {{- end }}
  resources:
    requests:
      storage: {{ .Values.backupVolume.size }}
{{- end }}
