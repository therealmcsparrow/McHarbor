# High-availability operator template.
#
# Usage:
#   1. Create ha.env from ha.env.example and replace every placeholder. Every
#      node must share the session secret, the encryption key and the backup key.
#      Those three, the database connection string and the bundled PostgreSQL
#      password are Docker secrets read from files (see ha.env.example), so none
#      of them appears in any container's docker inspect output. The password in
#      secrets/mcharbor_db_dsn must be the one in secrets/postgres_password.
#   2. Run: docker compose --env-file ha.env -f docker-compose.ha.yml up -d
#   3. Put a real load balancer in front of the node HTTP/HTTPS ports and
#      health-check each node on /api/readyz.
#
# This local template runs two McHarbor nodes on one Docker host for validation.
# Production HA should place each node on a separate host with the same env
# values, the same backup key material, and the same external database.

x-mcharbor-common: &mcharbor-common
  image: ${MCHARBOR_IMAGE:-ghcr.io/therealmcsparrow/mcharbor:latest}
  restart: unless-stopped
  depends_on:
    postgres:
      condition: service_healthy
  secrets:
    - source: mcharbor_backup_key
      target: mcharbor_backup_key
      mode: 0400
    - source: mcharbor_secret
      target: mcharbor_secret
      mode: 0400
    - source: mcharbor_encryption_key
      target: mcharbor_encryption_key
      mode: 0400
    - source: mcharbor_db_dsn
      target: mcharbor_db_dsn
      mode: 0400
  # Container health is liveness: a standby is healthy. Point the load
  # balancer at /api/readyz instead, which answers 503 on a standby or a
  # draining node so traffic stays on the active one.
  healthcheck:
    test: ["CMD-SHELL", "curl -fsk https://127.0.0.1:8705/api/livez || curl -fs http://127.0.0.1:8705/api/livez"]
    interval: 10s
    timeout: 5s
    retries: 3
    start_period: 60s

services:
  postgres:
    image: postgres:17-alpine
    restart: unless-stopped
    labels:
      - com.mcharbor.protected=true
    environment:
      - POSTGRES_DB=mcharbor
      - POSTGRES_USER=mcharbor
      - POSTGRES_PASSWORD_FILE=/run/secrets/postgres_password
    secrets:
      - source: postgres_password
        target: postgres_password
        mode: 0400
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U mcharbor -d mcharbor"]
      interval: 10s
      timeout: 5s
      retries: 10
    volumes:
      - mcharbor-postgres:/var/lib/postgresql/data

  mcharbor-node-1:
    <<: *mcharbor-common
    hostname: mcharbor-node-1
    environment:
      - LOG_LEVEL=${LOG_LEVEL:-info}
      - TZ=${TZ:-UTC}
      - DATA_DIR=/app/data
      - MCHARBOR_DB_DRIVER=postgres
      - MCHARBOR_DB_DSN_FILE=/run/secrets/mcharbor_db_dsn
      - MCHARBOR_NODE_ID=mcharbor-node-1
      - MCHARBOR_ADVERTISE_URL=${MCHARBOR_NODE_1_ADVERTISE_URL:-}
      - MCHARBOR_HA_MODE=${MCHARBOR_HA_MODE:-active-passive}
      - MCHARBOR_PLUGIN_STORE=${MCHARBOR_PLUGIN_STORE:-database}
      - MCHARBOR_SECRET_FILE=/run/secrets/mcharbor_secret
      - ENCRYPTION_KEY_FILE=/run/secrets/mcharbor_encryption_key
      - BACKUP_ENCRYPTION_KEY_FILE=/run/secrets/mcharbor_backup_key
      - TLS_ENABLED=${TLS_ENABLED:-true}
      - TLS_MIN_VERSION=${TLS_MIN_VERSION:-1.3}
      - HTTP_REDIRECT_ADDR=
      - FORCE_AGENT_TLS=${FORCE_AGENT_TLS:-true}
      - HSTS_MAX_AGE=${HSTS_MAX_AGE:-0}
      - SELF_SIGNED_SAN_EXTRA=${MCHARBOR_SELF_SIGNED_SAN_EXTRA:-}
      - ALLOWED_ORIGINS=${ALLOWED_ORIGINS}
      # Behind a load balancer, list its CIDR here so API-key usage history
      # records the real client rather than the balancer. Empty ignores
      # forwarding headers entirely, which is the safe default.
      - MCHARBOR_TRUSTED_PROXY_CIDRS=${MCHARBOR_TRUSTED_PROXY_CIDRS:-}
    ports:
      - "${MCHARBOR_NODE_1_HTTPS_PORT:-8443}:8705"
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro
      - mcharbor-node-1-data:/app/data
      - ${MCHARBOR_SHARED_BACKUP_PATH:-./mnt/backup}:/mnt/backup
      - ${MCHARBOR_LOCAL_APP_CATALOG_PATH:-./mnt/app-catalog}:/mnt/app-catalog:ro
      - ${MCHARBOR_LOCAL_PLUGIN_PATH:-./mnt/plugins}:/mnt/plugins:ro
      - ${MCHARBOR_LOCAL_THEMES_CATALOG_PATH:-./mnt/themes-catalog}:/mnt/themes-catalog:ro
      - ${MCHARBOR_LOCAL_PLUGIN_PATH_CATALOG:-./mnt/plugin-catalog}:/mnt/plugin-catalog:ro

  mcharbor-node-2:
    <<: *mcharbor-common
    hostname: mcharbor-node-2
    environment:
      - LOG_LEVEL=${LOG_LEVEL:-info}
      - TZ=${TZ:-UTC}
      - DATA_DIR=/app/data
      - MCHARBOR_DB_DRIVER=postgres
      - MCHARBOR_DB_DSN_FILE=/run/secrets/mcharbor_db_dsn
      - MCHARBOR_NODE_ID=mcharbor-node-2
      - MCHARBOR_ADVERTISE_URL=${MCHARBOR_NODE_2_ADVERTISE_URL:-}
      - MCHARBOR_HA_MODE=${MCHARBOR_HA_MODE:-active-passive}
      - MCHARBOR_PLUGIN_STORE=${MCHARBOR_PLUGIN_STORE:-database}
      - MCHARBOR_SECRET_FILE=/run/secrets/mcharbor_secret
      - ENCRYPTION_KEY_FILE=/run/secrets/mcharbor_encryption_key
      - BACKUP_ENCRYPTION_KEY_FILE=/run/secrets/mcharbor_backup_key
      - TLS_ENABLED=${TLS_ENABLED:-true}
      - TLS_MIN_VERSION=${TLS_MIN_VERSION:-1.3}
      - HTTP_REDIRECT_ADDR=
      - FORCE_AGENT_TLS=${FORCE_AGENT_TLS:-true}
      - HSTS_MAX_AGE=${HSTS_MAX_AGE:-0}
      - SELF_SIGNED_SAN_EXTRA=${MCHARBOR_SELF_SIGNED_SAN_EXTRA:-}
      - ALLOWED_ORIGINS=${ALLOWED_ORIGINS}
      # Behind a load balancer, list its CIDR here so API-key usage history
      # records the real client rather than the balancer. Empty ignores
      # forwarding headers entirely, which is the safe default.
      - MCHARBOR_TRUSTED_PROXY_CIDRS=${MCHARBOR_TRUSTED_PROXY_CIDRS:-}
    ports:
      - "${MCHARBOR_NODE_2_HTTPS_PORT:-8444}:8705"
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro
      - mcharbor-node-2-data:/app/data
      - ${MCHARBOR_SHARED_BACKUP_PATH:-./mnt/backup}:/mnt/backup
      - ${MCHARBOR_LOCAL_APP_CATALOG_PATH:-./mnt/app-catalog}:/mnt/app-catalog:ro
      - ${MCHARBOR_LOCAL_PLUGIN_PATH:-./mnt/plugins}:/mnt/plugins:ro
      - ${MCHARBOR_LOCAL_THEMES_CATALOG_PATH:-./mnt/themes-catalog}:/mnt/themes-catalog:ro
      - ${MCHARBOR_LOCAL_PLUGIN_PATH_CATALOG:-./mnt/plugin-catalog}:/mnt/plugin-catalog:ro

secrets:
  mcharbor_backup_key:
    file: ${MCHARBOR_BACKUP_KEY_FILE:-./secrets/mcharbor_backup_key}
  mcharbor_secret:
    file: ${MCHARBOR_SECRET_HOST_FILE:-./secrets/mcharbor_secret}
  mcharbor_encryption_key:
    file: ${MCHARBOR_ENCRYPTION_KEY_HOST_FILE:-./secrets/mcharbor_encryption_key}
  mcharbor_db_dsn:
    file: ${MCHARBOR_DB_DSN_HOST_FILE:-./secrets/mcharbor_db_dsn}
  postgres_password:
    file: ${POSTGRES_PASSWORD_HOST_FILE:-./secrets/postgres_password}

volumes:
  mcharbor-postgres:
  mcharbor-node-1-data:
  mcharbor-node-2-data:
