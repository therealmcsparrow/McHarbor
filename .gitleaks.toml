[extend]
useDefault = true

[[allowlists]]
description = "Test fixtures, generated bundles and git-ignored local artefacts"
paths = [
  '''_test\.go$''',
  '''\.test\.tsx?$''',
  '''\.umd\.cjs$''',
  '''frontend/coverage/''',
  '''backend/data/''',
  '''plugins/scaffold-plugin-frontend\.ps1$''',
]

[[allowlists]]
description = "Identifiers that only look like keys"
targetRules = ["generic-api-key"]
paths = [
  '''backend/core/db/squash\.go$''',
  '''frontend/resources/stores/navigation\.ts$''',
]
