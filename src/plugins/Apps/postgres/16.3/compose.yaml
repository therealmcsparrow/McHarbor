# Generated by McHarbor App Store from Apps/postgres/template.json.
# For reference only; the install flow uses the JSON template.

services:
  postgres:
    image: postgres:16.3
    container_name: ${MCHARBOR_STACK_NAME}
    restart: unless-stopped
    ports:
      - "${HOST_PORT_5432:-5432}:5432"
    volumes:
      - "/data/postgres:/var/lib/postgresql/data"
    environment:
      POSTGRES_USER: "${POSTGRES_USER}"
      POSTGRES_PASSWORD: "${POSTGRES_PASSWORD}"
      POSTGRES_DB: "${POSTGRES_DB:-}"
      TZ: "${TZ:-UTC}"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER"]
      interval: 30s
      timeout: 5s
      retries: 5