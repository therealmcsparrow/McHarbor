# Generated by McHarbor App Store from Apps/nginx/template.json.
# This file is for reference only; the install flow uses the JSON
# template directly. The compose shown here mirrors what `docker
# compose -f` would receive at deploy time.

services:
  nginx:
    image: nginx:1.27.0
    container_name: ${MCHARBOR_STACK_NAME}
    restart: unless-stopped
    ports:
      - "${HOST_PORT_80:-80}:80"
      - "${HOST_PORT_443:-443}:443"
    volumes:
      - "/data/nginx/conf.d:/etc/nginx/conf.d"
      - "/data/nginx/html:/usr/share/nginx/html"
      - "/data/nginx/certs:/etc/nginx/certs:ro"
    environment:
      TZ: "${TZ:-UTC}"
    healthcheck:
      test: ["CMD", "wget", "--spider", "-q", "http://localhost/"]
      interval: 30s
      timeout: 5s
      retries: 3