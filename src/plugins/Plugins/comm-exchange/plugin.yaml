# plugin.yaml — manifest for the comm-exchange plugin.
#
# Single-channel Exchange Online notification adapter. This is intentionally
# a communication plugin, not an email-server adapter: it registers one
# NotificationAdapterSpec and delivers notification messages through Microsoft
# Graph directly from Settings > Notifications > Channels.
schema: "mcharbor.plugin/v1"

slug:     "comm-exchange"
name:     "Exchange"
version:  "2026.10.01"
author:   "McSparrow"
email:    "support@mcsparrow.eu"
license:  "Apache-2.0"
homepage: "https://www.mcharbor.eu/docs/plugins"
description: "Exchange Online communication channel. Delivers workflow, alert, and backup notifications as email through Microsoft Graph. Install this plugin to add 'Exchange Online' as a channel_type in Settings > Notifications > Channels."

mcharbor: ">=2026.10.01"
go:       ">=1.23"

permissions:
  - notification.adapter.register
  - encryption.handle.read
  - audit.emit

adds_permissions:
  - key:      "channels.use_comm_exchange"
    scope:    "global"
    category: "Communications"
    label:    "Send alerts through Exchange communication channels"
    description: "Required to route workflow, alert, or backup events to an Exchange Online communication channel."

contributes:
  routes: []
  widgets: []
  nodes: []
  i18n_namespaces:
    - "comm-exchange"
  forms:
    - resource: "channel"
      kind:     "config_form"
      key:      "exchange"
    - resource: "channel"
      kind:     "setup_guide"
      key:      "exchange"
  capabilities:
    - kind:         "email-channel"
      channel_type: "exchange"

signature: ""
checksum:  ""
