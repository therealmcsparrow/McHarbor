# plugin.yaml — manifest for the identity-saml plugin.
#
# Single-provider SAML 2.0 identity plugin. The plugin owns the
# Service-Provider flow (AuthnRequest generation + assertion parsing)
# for one provider type ("saml_2_0"), with the host's identity
# module dispatching the public /authorize, /callback, and
# /metadata endpoints through the IdentityAdapterClient interface.
#
# Family: identity-* (external identity providers). Distinct from
# storage-* and comm-* adapters: identity plugins implement
# plugin.IdentityAdapterClient (Test + BeginAuth + HandleCallback +
# FetchGroups + MetadataXML) and never touch Docker, notifications,
# or storage.
#
# RBAC: identity plugins bypass RBAC by convention — the host's
# settings.manage permission is sufficient for the admin UI's
# provider-type picker. This plugin declares no `adds_permissions`.
#
# State: the plugin owns its SAML request-id map in memory, keyed
# by the request ID the IdP echoes back via InResponseTo. State is
# short-lived (10 min) and SAML flows are dex-cardinal, so host
# restart during a flow is rare enough not to require v1
# persistence. A future release can add a `plugin_identity_saml_states`
# table via contributes.migrations.
schema: "mcharbor.plugin/v1"

slug:     "identity-saml"
name:     "SAML 2.0"
version:  "2026.10.01"
author:   "McSparrow"
email:    "support@mcsparrow.eu"
license:  "Apache-2.0"
homepage: "https://www.mcharbor.eu/docs/plugins"
description: "SAML 2.0 identity provider. Service-Provider-side flow against any SAML 2.0 IdP (Okta, Auth0, Keycloak, ADFS, Google Workspace, Azure AD). SP metadata is auto-generated; optional signed AuthnRequests via uploaded SP keypair. Install to add 'SAML 2.0' as a provider_type in Settings > Security > Identity Providers."

mcharbor: ">=2026.10.02"
go:       ">=1.23"

# Capabilities the plugin needs from the host.
#   identity.adapter.register  required — register the IdentityAdapterSpec
#   audit.emit                 required — emit audit events on Test/Auth
#   encryption.handle.read     optional — read secret-typed fields back
permissions:
  - identity.adapter.register
  - audit.emit
  - encryption.handle.read

# No adds_permissions — identity plugins skip RBAC overlays.

contributes:
  routes: []
  # No `menu:` block — identity providers are managed from the host's
  # Settings > Security > Identity Providers page, which lists every
  # registered ProviderType (built-in + plugin).
  widgets: []
  nodes: []
  i18n_namespaces:
    - "identity-saml"
  # Form slots this plugin owns. The host's identity dialog looks up
  # a plugin for each (resource, kind, key) slot and mounts the
  # plugin's UMD bundle into the dialog. The bundle name is
  # slug-derived (`<slug>.umd.cjs`), so no `frontend:` field is needed.
  forms:
    - resource: "identity_provider"
      kind:     "config_form"
      key:      "saml_2_0"
    - resource: "identity_provider"
      kind:     "setup_guide"
      key:      "saml_2_0"

signature: ""
checksum:  ""