schema: "mcharbor.plugin/v1"
slug: "storage-ftp"
name: "FTP/FTPS"
version: "2026.10.01"
description: "Backup destination backed by an FTP (RFC 959) or FTPS (RFC 4217) server. Auth methods: anonymous, password, FTPS-explicit (AUTH TLS), FTPS-implicit (port 990), and client-certificate (mTLS)."
author: "McSparrow <support@mcsparrow.eu>"
homepage: "https://www.mcharbor.eu/docs/plugins"

mcharbor: ">=2026.10.01"
go: ">=1.23"

permissions:
  - storage.adapter.register
  - audit.emit

i18n_namespaces:
  - "storage-ftp"

contributes:
  forms:
    - { resource: storage_location, kind: config_form, key: ftp }
    - { resource: storage_location, kind: setup_guide, key: ftp }
