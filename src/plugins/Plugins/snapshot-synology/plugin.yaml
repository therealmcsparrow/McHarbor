# plugin.yaml — manifest for the snapshot-synology plugin.
#
# Snapshot driver family — Synology DSM snapshot repository via
# the DSM 7.x REST API. Filesystem-level snapshots that the host
# uses to back up containers without `docker pause`.
#
# Architecture (see core/plugin/adapters.go §SnapshotAdapter*):
#   - RequiresAgent=false: the plugin calls Synology's REST API
#     directly from the host process. No agent transport needed.
#   - SupportsRemoteTarget=true: Synology is a remote NAS target.
#   - The plugin owns HTTP routing under /api/plugins/snapshot-synology
#     for the setup wizard / test connection actions; the host's
#     container-backup admin UI is the primary surface.
#
# RBAC: snapshot plugins bypass the per-plugin permission registry
# (mirrors mcharbor-storage-plugins-no-rbac). RegisterPermissions is
# a no-op.
schema: "mcharbor.plugin/v1"

slug:     "snapshot-synology"
name:     "Synology DSM"
version:  "2026.10.01"
author:   "McSparrow"
email:    "support@mcsparrow.eu"
license:  "Apache-2.0"
homepage: "https://www.mcharbor.eu/docs/plugins"
description: "Synology DSM snapshot repository via the DSM 7.x REST API. Take filesystem-level snapshots without `docker pause`. Supports Hyper Backup vault and shared folder snapshots."

mcharbor: ">=2026.10.02"
go:       ">=1.23"

permissions:
  - snapshot.adapter.register
  - audit.emit

contributes:
  routes: []
  widgets: []
  nodes: []
  i18n_namespaces:
    - "snapshot-synology"
  forms:
    - resource: "snapshot_config"
      kind:     "config_form"
      key:      "synology"
    - resource: "snapshot_config"
      kind:     "setup_guide"
      key:      "synology"

signature: ""
checksum:  ""
