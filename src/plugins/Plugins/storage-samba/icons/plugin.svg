<?xml version="1.0" encoding="UTF-8"?>
<!-- Samba/SMB destination plugin tile.
     Glyph: Tabler `cloud-share` (MIT — tabler-icons, Paweł Kuna)
     https://github.com/tabler/tabler-icons/blob/main/icons/outline/cloud-share.svg
     License: https://github.com/tabler/tabler-icons/blob/main/LICENSE
     Color: Samba brand green #0066B3 (a hue commonly associated
     with samba.org's classic mark — the project itself has no
     single-color icon, so we lean on the standard "distributed
     file share" metaphor that fits the SMB tile).

     Used for the storage-location picker and the backup overview
     destination list when the operator picks the samba
     LocationType. -->
