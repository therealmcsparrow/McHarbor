mcharbor: ">=2026.10.02"
go: ">=1.23"

permissions:
  - storage.adapter.register
  - audit.emit

i18n_namespaces:
  - "storage-samba"

contributes:
  forms:
    - { resource: storage_location, kind: config_form, key: samba }
    - { resource: storage_location, kind: setup_guide, key: samba }