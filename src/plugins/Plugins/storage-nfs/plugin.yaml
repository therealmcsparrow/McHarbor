schema: "mcharbor.plugin/v1"
slug: "storage-nfs"
name: "NFS"
version: "2026.10.01"
description: "Backup destination backed by an NFS (RFC 7530) export. AUTH_SYS (UID-based) plus Kerberos flavors (krb5/krb5i/krb5p) via the kernel nfs client."
author: "Maintainer Name <maintainer@example.com>"
homepage: "https://www.mcharbor.eu/docs/plugins"

mcharbor: ">=2026.10.01"
go: ">=1.23"

permissions:
  - storage.adapter.register
  - audit.emit

i18n_namespaces:
  - "storage-nfs"

contributes:
  forms:
    - resource: storage_location
      kind: config_form
      key: nfs
    - resource: storage_location
      kind: setup_guide
      key: nfs