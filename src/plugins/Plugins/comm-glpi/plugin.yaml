schema: "mcharbor.plugin/v1"

slug:     "comm-glpi"
name:     "GLPI"
version:  "2026.10.01"
author:   "McSparrow"
email:    "support@mcsparrow.eu"
license:  "Apache-2.0"
homepage: "https://www.mcharbor.eu/docs/plugins"
description: "Opens, follows up and solves GLPI tickets from McHarbor alerts through the GLPI REST API (v1) or high-level API (v2, GLPI 11), with signed GLPI 11 webhooks or polling for status."

mcharbor: ">=2026.10.01"
go:       ">=1.26"

permissions:
  - notification.adapter.register
  - encryption.handle.read
  - audit.emit

adds_permissions:
  - key:      "channels.use_comm_glpi"
    scope:    "global"
    category: "Communications"
    label:    "Route alerts to GLPI"
    description: "Required to route alert and workflow incidents to a GLPI communication channel."

contributes:
  routes: []
  widgets: []
  nodes: []
  i18n_namespaces:
    - "comm-glpi"
  forms:
    - resource: "channel"
      kind:     "config_form"
      key:      "glpi"
    - resource: "channel"
      kind:     "setup_guide"
      key:      "glpi"

signature: ""
checksum:  ""
