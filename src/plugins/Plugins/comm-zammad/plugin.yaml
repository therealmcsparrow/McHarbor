schema: "mcharbor.plugin/v1"

slug:     "comm-zammad"
name:     "Zammad"
version:  "2026.10.01"
author:   "McSparrow"
email:    "support@mcsparrow.eu"
license:  "Apache-2.0"
homepage: "https://www.mcharbor.eu/docs/plugins"
description: "Opens, notes and closes Zammad tickets from McHarbor alerts through the Zammad REST API, with HMAC-signed trigger webhooks or polling for status."

mcharbor: ">=2026.10.01"
go:       ">=1.23"

permissions:
  - notification.adapter.register
  - encryption.handle.read
  - audit.emit

adds_permissions:
  - key:      "channels.use_comm_zammad"
    scope:    "global"
    category: "Communications"
    label:    "Route alerts to Zammad"
    description: "Required to route alert and workflow incidents to a Zammad communication channel."

contributes:
  routes: []
  widgets: []
  nodes: []
  i18n_namespaces:
    - "comm-zammad"
  forms:
    - resource: "channel"
      kind:     "config_form"
      key:      "zammad"
    - resource: "channel"
      kind:     "setup_guide"
      key:      "zammad"

signature: ""
checksum:  ""
