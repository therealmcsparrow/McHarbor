# plugin.yaml — manifest for the identity-ldap plugin.
#
# Single-provider LDAP identity plugin. The plugin owns the bind-and-
# search authentication flow for one provider type ("ldap"), with the
# host's identity module dispatching the public Test / FetchGroups
# methods through the IdentityAdapterClient interface.
#
# Family: identity-* (external identity providers). Distinct from
# storage-* and comm-* adapters: identity plugins implement
# plugin.IdentityAdapterClient (Test + FetchGroups) and never touch
# Docker, notifications, or storage.
#
# Plugin-owned route: this plugin is the only identity plugin that
# owns an HTTP route — POST /api/identity-ldap/auth — because
# LDAP's form-post authentication flow doesn't fit the OIDC/SAML
# redirect dance the host dispatches. The plugin handles the bind +
# search only; lockout, provisioning, MFA, the session cookie and the
# reply are the host's, reached through the external-login capability
# on host.Identity (declared locally in backend/external_login.go).
#
# RBAC: identity plugins bypass RBAC by convention — the host's
# settings.manage permission is sufficient for the admin UI's
# provider-type picker. This plugin declares no `adds_permissions`.
#
# Data ownership: the host's unified `identity_providers` table holds
# the per-provider config (url/bind_dn/bind_password/user_base_dn/...)
# in its `config` column. The plugin never reads that table: the host
# hands it the decrypted map. No plugin-owned DB table.
schema: "mcharbor.plugin/v1"

slug:     "identity-ldap"
name:     "LDAP / Active Directory"
version:  "2026.10.01"
author:   "McSparrow"
email:    "support@mcsparrow.eu"
license:  "Apache-2.0"
homepage: "https://www.mcharbor.eu/docs/plugins"
description: "LDAP / Active Directory identity provider. Form-based bind-and-search authentication (search-then-rebind) against OpenLDAP, AD, 389 DS, etc. Optional StartTLS or LDAPS. Install this plugin to add 'LDAP / Active Directory' as a provider_type in Settings > Security > Identity Providers."

mcharbor: ">=2026.10.01"
go:       ">=1.23"

# Capabilities the plugin needs from the host.
#   identity.adapter.register  required — register the IdentityAdapterSpec
#   identity.read              required — read its own provider's config, secrets decrypted host-side
#   identity.write             required — have the host lock out, provision and sign in the user
#   audit.emit                 required — emit audit events on Test/Auth
permissions:
  - identity.adapter.register
  - identity.read
  - identity.write
  - audit.emit

# No adds_permissions — identity plugins skip RBAC overlays.

contributes:
  capabilities:
    - kind: login-endpoint
      provider_type: ldap
      path: "/api/identity-ldap/auth"
  routes:
    # Public auth endpoint — accepts {providerId, username, password}
    # and performs search-then-rebind; the host gates, provisions and
    # completes the sign-in and writes the reply. The plugin owns this
    # route because LDAP's flow doesn't fit the OIDC/SAML /callback
    # dispatch the host's identity module already exposes.
    - method: POST
      path:   "/api/identity-ldap/auth"
      public: true
      audit_required: true
      audit_action: "identity_provider.callback"
      audit_entity_type: "identity_provider"
  # No `menu:` block — identity providers are managed from the host's
  # Settings > Security > Identity Providers page, which lists every
  # registered ProviderType (built-in + plugin).
  widgets: []
  nodes: []
  i18n_namespaces:
    - "identity-ldap"
  # Form slots this plugin owns. The host's identity dialog looks up
  # a plugin for each (resource, kind, key) slot and mounts the
  # plugin's UMD bundle into the dialog. The bundle name is
  # slug-derived (`<slug>.umd.cjs`), so no `frontend:` field is needed.
  forms:
    - resource: "identity_provider"
      kind:     "config_form"
      key:      "ldap"
    - resource: "identity_provider"
      kind:     "setup_guide"
      key:      "ldap"

signature: ""
checksum:  ""
