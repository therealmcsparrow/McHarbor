schema: "mcharbor.plugin/v1"

slug:     "comm-pagerduty"
name:     "PagerDuty"
version:  "2026.10.01"
author:   "McSparrow"
email:    "support@mcsparrow.eu"
license:  "Apache-2.0"
homepage: "https://www.mcharbor.eu/docs/plugins"
description: "PagerDuty incident channel. Triggers, re-notifies and resolves PagerDuty incidents through Events API v2 and reads acknowledge/resolve back through signed v3 webhooks or REST polling."

mcharbor: ">=2026.10.02"
go:       ">=1.26"

permissions:
  - notification.adapter.register
  - encryption.handle.read
  - audit.emit

adds_permissions:
  - key:      "channels.use_comm_pagerduty"
    scope:    "global"
    category: "Communications"
    label:    "Send alerts through PagerDuty channels"
    description: "Required to route alert, workflow, or incident events to a PagerDuty channel."

contributes:
  routes: []
  widgets: []
  nodes: []
  i18n_namespaces:
    - "comm-pagerduty"
  forms:
    - resource: "channel"
      kind:     "config_form"
      key:      "pagerduty"
    - resource: "channel"
      kind:     "setup_guide"
      key:      "pagerduty"

signature: ""
checksum:  ""
