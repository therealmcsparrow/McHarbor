# plugin.yaml — manifest for the comm-smtp plugin.
#
# Single-channel SMTP notification adapter. This is intentionally a
# communication plugin, not an email-server adapter: it registers one
# NotificationAdapterSpec and delivers notification messages through a
# configured SMTP server directly from Settings > Notifications > Channels.
schema: "mcharbor.plugin/v1"

slug:     "comm-smtp"
name:     "SMTP"
version:  "2026.10.01"
author:   "McSparrow"
email:    "support@mcsparrow.eu"
license:  "Apache-2.0"
homepage: "https://www.mcharbor.eu/docs/plugins"
description: "SMTP communication channel. Delivers workflow, alert, and backup notifications as email through a configured SMTP relay. Install this plugin to add 'SMTP email' as a channel_type in Settings > Notifications > Channels."

mcharbor: ">=2026.10.02"
go:       ">=1.23"

permissions:
  - notification.adapter.register
  - encryption.handle.read
  - audit.emit

adds_permissions:
  - key:      "channels.use_comm_smtp"
    scope:    "global"
    category: "Communications"
    label:    "Send alerts through SMTP communication channels"
    description: "Required to route workflow, alert, or backup events to an SMTP communication channel."

contributes:
  routes: []
  widgets: []
  nodes: []
  i18n_namespaces:
    - "comm-smtp"
  forms:
    - resource: "channel"
      kind:     "config_form"
      key:      "smtp"
    - resource: "channel"
      kind:     "setup_guide"
      key:      "smtp"
  capabilities:
    - kind:         "email-channel"
      channel_type: "smtp"

signature: ""
checksum:  ""
