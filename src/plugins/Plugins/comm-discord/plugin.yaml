# plugin.yaml — manifest for the comm-discord plugin.
#
# Single-channel Discord notification adapter. This is intentionally a
# communication plugin: it registers one NotificationAdapterSpec and
# delivers messages through a configured Discord webhook.
schema: "mcharbor.plugin/v1"

slug:     "comm-discord"
name:     "Discord"
version:  "2026.10.01"
author:   "McSparrow"
email:    "support@mcsparrow.eu"
license:  "Apache-2.0"
homepage: "https://www.mcharbor.eu/docs/plugins"
description: "Discord communication channel. Delivers workflow, alert, and backup notifications to a Discord channel through a webhook URL."

mcharbor: ">=2026.10.01"
go:       ">=1.23"

permissions:
  - notification.adapter.register
  - encryption.handle.read
  - audit.emit

adds_permissions:
  - key:      "channels.use_comm_discord"
    scope:    "global"
    category: "Communications"
    label:    "Send alerts through Discord communication channels"
    description: "Required to route workflow, alert, or backup events to a Discord communication channel."

contributes:
  routes: []
  widgets: []
  nodes: []
  i18n_namespaces:
    - "comm-discord"
  forms:
    - resource: "channel"
      kind:     "config_form"
      key:      "discord"
    - resource: "channel"
      kind:     "setup_guide"
      key:      "discord"
  capabilities:
    - kind:         "workflow-node-alias"
      alias:        "send-discord"
      channel_type: "discord"

signature: ""
checksum:  ""
