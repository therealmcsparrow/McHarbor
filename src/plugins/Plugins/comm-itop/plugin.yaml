schema: "mcharbor.plugin/v1"

slug:     "comm-itop"
name:     "iTop"
version:  "2026.10.01"
author:   "McSparrow"
email:    "support@mcsparrow.eu"
license:  "Apache-2.0"
homepage: "https://www.mcharbor.eu/docs/plugins"
description: "Creates, logs and resolves Combodo iTop incidents from McHarbor alerts through the iTop REST/JSON web service, following the iTop lifecycle, with webhook or polling status sync."

mcharbor: ">=2026.10.01"
go:       ">=1.26"

permissions:
  - notification.adapter.register
  - encryption.handle.read
  - audit.emit

adds_permissions:
  - key:      "channels.use_comm_itop"
    scope:    "global"
    category: "Communications"
    label:    "Route alerts to iTop"
    description: "Required to route alert and workflow incidents to an iTop communication channel."

contributes:
  routes: []
  widgets: []
  nodes: []
  i18n_namespaces:
    - "comm-itop"
  forms:
    - resource: "channel"
      kind:     "config_form"
      key:      "itop"
    - resource: "channel"
      kind:     "setup_guide"
      key:      "itop"

signature: ""
checksum:  ""
