  # Snapshot driver plugins (added 2026-08-12). Each plugin
  # registers a SnapshotAdapterSpec under a single driver key
  # (synology / truenas). Filesystem-level drivers (zfs, btrfs, lvm,
  # vss) are builtin instead — see core/snapshotdrivers, since only
  # the agent can see which CLI a remote host has. The snapshot
  # adapter is dispatched by writeArchive when a
  # BackupPlan.consistency_mode="snapshot"
  # points at one of these configurations. Snapshots freeze the
  # filesystem / NAS-target while the host writes the backup
  # archive, then unfreeze without ever pausing the container.
  - slug: "snapshot-synology"
    name: "Synology DSM"
    category: "Snapshots"
    description: "Synology DSM snapshot repository via the DSM 7.x REST API. Filesystem-level snapshots without `docker pause`. Supports Hyper Backup vault and shared folder snapshots."
    icon: "synology.svg"
    versions:
      - version: "1.0.0"
        tarball: "Plugins/snapshot-synology/dist/mcharbor-plugin-snapshot-synology-1.0.0.tar.gz"
        signature: "Plugins/snapshot-synology/dist/mcharbor-plugin-snapshot-synology-1.0.0.tar.gz.sig"
        mcharbor_min: "2.2.0"
        permissions:
