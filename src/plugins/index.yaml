        mcharbor_min: "2.1.0"
        permissions:
          - "identity.adapter.register"
          - "audit.emit"
          - "encryption.handle.read"

  - slug: "identity-google"
    name: "Google Workspace"
    category: "Identity providers"
    description: "Google Workspace identity provider. OIDC authorization-code flow against accounts.google.com plus the Google Admin SDK Directory API for group fetching when a hosted domain is configured. Tile shows up in Settings > Security > Identity Providers as 'Google'."
