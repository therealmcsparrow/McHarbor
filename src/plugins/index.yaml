# add their own keys for self-hosted catalogs.
#
# Schema is parsed by modules/appstore/catalog.go with two extra
# top-level keys: `plugins:` and the bottom-of-file signature block.
schema: "mcharbor.addons/v1"
generated_at: "2026-08-01T00:00:00Z"
generator: "make sign-index"

apps:
  - slug: "nginx"
    name: "NGINX"
    category: "Web servers"
    description: "High-performance HTTP server and reverse proxy."
    icon: "nginx.svg"
    versions:
      - version: "1.27.0"
        compose: "Apps/nginx/1.27.0/compose.yaml"
        env_defaults:
          TZ: "UTC"
        # Read by the appstore installer at deploy time.
        ports:
          - host: 80
            container: 80
            protocol: tcp
  - slug: "postgres"
    name: "PostgreSQL"
    category: "Databases"
    description: "PostgreSQL 16 with persistent volume."
    icon: "postgres.svg"
    versions:
      - version: "16.3"
        compose: "Apps/postgres/16.3/compose.yaml"
        env_defaults:
          POSTGRES_PASSWORD: ""   # admin must supply at install
        volumes:
          - name: "data"
            path: "/var/lib/postgresql/data"

