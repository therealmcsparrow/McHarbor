  # Communication channel plugins (added 2026-08-10). Each plugin
  # registers a NotificationAdapterSpec that owns one ChannelType
  # (slack / discord / teams / gotify / ntfy / telegram / signal /
  # whatsapp). Channels are managed from the host's Settings >
  # Notifications > Channels page; events fan out via the host's
  # notify.Dispatcher at workflow + alert + backup-completion time.
  - slug: "comm-telegram"
    name: "Telegram"
    category: "Communication channels"
    description: "Telegram Bot API notification channel. Delivers workflow and backup events to a chat via bot_token + chat_id. Supports Markdown/HTML parse_mode and silent sends."
    icon: "telegram.svg"
    versions:
      - version: "1.0.0"
        tarball: "Plugins/comm-telegram/dist/mcharbor-plugin-comm-telegram-1.0.0.tar.gz"
        signature: "Plugins/comm-telegram/dist/mcharbor-plugin-comm-telegram-1.0.0.tar.gz.sig"
        mcharbor_min: "2.1.0"
        permissions:
          - "notification.adapter.register"
          - "encryption.handle.read"
          - "audit.emit"

  # comm-whatsapp: WhatsApp notification channel (added 2026-08-10).
  # Single ChannelType "whatsapp" with four connection methods selected
  # via the cfg["method"] discriminator at channel-config time:
  #   cloud   Official Meta Cloud API (graph.facebook.com /v21.0/<phone_id>/messages)
  #   gateway Self-hosted gateway (Baileys/wa-gateway/etc.)
  #   bot     WhatsApp Business API platform (360dialog-style)
  #   saas    Third-party SaaS (Twilio, MessageBird, Gupshup, ...)
  # Encrypted credentials, no OAuth flow (long-lived tokens).
  - slug: "comm-whatsapp"
    name: "WhatsApp"
    category: "Communication channels"
    description: "WhatsApp notification channel. Delivers workflow and backup events to a phone number via one of four connection methods: Meta Cloud API, self-hosted gateway, WhatsApp Business API platform, or a third-party SaaS provider."
    icon: "whatsapp.svg"
    versions:
      - version: "1.0.0"
        tarball: "Plugins/comm-whatsapp/dist/mcharbor-plugin-comm-whatsapp-1.0.0.tar.gz"
        signature: "Plugins/comm-whatsapp/dist/mcharbor-plugin-comm-whatsapp-1.0.0.tar.gz.sig"
        mcharbor_min: "2.1.0"
        permissions:
          - "notification.adapter.register"
          - "encryption.handle.read"
          - "audit.emit"

  # comm-signal: Signal notification channel (added 2026-08-10).
  # Single ChannelType "signal" with four connection methods selected
  # via the cfg["method"] discriminator at channel-config time:
  #   rest    Official signal-cli-rest-api server
  #           (POST <server_url>/v2/send, optional HTTP Basic auth)
  #   bot     Token-based Signal bot server
  #           (POST <server_url>/message with Bearer token)
  #   signald signald daemon JSON-RPC 2.0 API
  #           (POST <server_url>/v1/accounts/<account>/rpc)
  #   simple  No-auth community relay / public test endpoint
  #           (POST <server_url>/send, no credentials)
  # Encrypted credentials, no OAuth flow (Signal gateways use
  # pre-registered numbers + bearer tokens).
  - slug: "comm-signal"
    name: "Signal"
    category: "Communication channels"
    description: "Signal notification channel. Delivers workflow and backup events to phone numbers via one of four connection methods: official signal-cli-rest-api, token-based bot server, signald JSON-RPC daemon, or a no-auth community relay."
    icon: "signal.svg"
