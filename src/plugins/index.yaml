  # Identity provider plugins (added 2026-08-15 as part of the
  # "Identity Providers as Plugins" port). Each plugin owns one
  # provider_type (entra_id, google, generic_oidc, saml_2_0, ldap)
  # and replaces a slice of the host's hardcoded OIDC/SAML/LDAP
  # machinery. The host's BeginAuth / HandleCallback / HandleSAMLACS
  # / SAMLMetadata / TestConnection / FetchProviderGroups dispatch
  # to the matching plugin via Runtime.IdentityAdapter(provider_type).
  - slug: "identity-entra-id"
    name: "Microsoft Entra ID"
    category: "Identity providers"
    description: "Microsoft Entra ID identity provider. OIDC authorization-code flow against the v2.0 endpoints at login.microsoftonline.com plus the Microsoft Graph API for group fetching. Tile shows up in Settings > Security > Identity Providers as 'Microsoft Entra ID'."
