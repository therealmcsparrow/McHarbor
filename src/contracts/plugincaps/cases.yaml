# Shared by src/backend/core/plugincaps (Parse) and src/cli/internal/cli (plugin dev validate).
# Each case appends its `capabilities` text to `manifest`; `error` is a substring both
# implementations must put in their message, and an empty `error` means the manifest must pass.
manifest: |
  schema: "mcharbor.plugin/v1"
  slug: addon-demo
  adds_permissions:
    - key: "demo.view"
    - key: "demo.backup.manage"
    - key: "demo.backup.delete"
    - key: "demo.restore.run"
    - key: "demo.manage"
    - key: "demo.console"
  consumes_permissions:
    - "compute.view"
    - "host_updates.reboot"
  contributes:
    routes:
      - method: GET
        path: "/api/demo"
      - method: DELETE
        path: "/api/demo/backups/{runId}"
      - method: DELETE
        path: "/api/demo/backup-plans/{planId}"
      - method: POST
        path: "/api/demo/auth"
        public: true
      - method: POST
        path: "/api/demo/private"
      - method: GET
        path: "/api/demo/machines"
        requires_permission: "demo.view"
      - method: POST
        path: "/api/demo/machines/{id}/start"
        requires_permission: "demo.manage"
      - method: GET
        path: "/api/demo/machines/{id}/logs"
        requires_permission: "demo.view"
      - method: POST
        path: "/api/demo/reports"
      - method: GET
        path: "/api/demo/reports/{id}/export"
      - method: GET
        path: "/api/demo/reboot-drain"
        requires_permission: "demo.view"
      - method: POST
        path: "/api/demo/reboot-drain/stop"
        requires_permission: "host_updates.reboot"
      - method: POST
        path: "/api/demo/reboot-drain/foreign"
        requires_permission: "other.manage"
      - method: GET
        path: "/api/demo/foreign-list"
        requires_permission: "other.view"
    nodes:
      - "demo-trigger"
    forms:
      - {resource: channel, kind: config_form, key: pigeon}
      - {resource: storage, kind: config_form, key: carrier}
    capabilities:
cases:
  - name: every kind is accepted
    error: ""
    capabilities: |
      - kind: runbook-provider
        domain: vm
      - kind: backup-row-actions
        source_kind: vm
        pages: {open: "/plugins/addon-demo/{subject}", restore: "/plugins/addon-demo/{subject}/r/{id}", edit_plan: "/plugins/addon-demo/{subject}/p/{id}"}
        routes: {delete_run: "/api/demo/backups/{id}", delete_plan: "/api/demo/backup-plans/{id}"}
        permissions: {view: demo.view, manage: demo.backup.manage, delete: demo.backup.delete, restore: demo.restore.run}
      - kind: estate-source
        metric: vms
        path: "/api/demo"
        environment_field: environmentId
      - kind: lifecycle-subject
        subject_type: vm
        page: "/plugins/addon-demo"
      - kind: document-export
        formats: [pdf, docx]
        permission: compute.view
        generate_path: "/api/demo/reports"
        export_path: "/api/demo/reports/{id}/export"
      - kind: login-endpoint
        provider_type: ldap
        path: "/api/demo/auth"
  - name: unknown kind
    error: unknown kind
    capabilities: |
      - kind: teleport
        domain: vm
  - name: missing required field
    error: is required
    capabilities: |
      - kind: estate-source
        metric: vms
        path: "/api/demo"
  - name: field from another kind
    error: does not apply to this kind
    capabilities: |
      - kind: runbook-provider
        domain: vm
        page: "/plugins/addon-demo"
  - name: bad token
    error: must match
    capabilities: |
      - kind: runbook-provider
        domain: "VM Stuff"
  - name: bad environment field
    error: is not a JSON field name
    capabilities: |
      - kind: estate-source
        metric: vms
        path: "/api/demo"
        environment_field: "1bad"
  - name: page under another plugin
    error: must be /plugins/addon-demo or a path under it
    capabilities: |
      - kind: lifecycle-subject
        subject_type: vm
        page: "/plugins/addon-other"
  - name: page prefix trick
    error: must be /plugins/addon-demo or a path under it
    capabilities: |
      - kind: lifecycle-subject
        subject_type: vm
        page: "/plugins/addon-demo-evil"
  - name: route outside the api tree
    error: must start with /api/
    capabilities: |
      - kind: estate-source
        metric: vms
        path: "/demo"
        environment_field: environmentId
  - name: undeclared route
    error: is not a route this plugin declares
    capabilities: |
      - kind: estate-source
        metric: vms
        path: "/api/other"
        environment_field: environmentId
  - name: wrong method
    error: is not a route this plugin declares
    capabilities: |
      - kind: estate-source
        metric: vms
        path: "/api/demo/auth"
        environment_field: environmentId
  - name: login route not public
    error: is declared but not public
    capabilities: |
      - kind: login-endpoint
        provider_type: ldap
        path: "/api/demo/private"
  - name: malformed permission key
    error: is not a permission key
    capabilities: |
      - kind: document-export
        formats: [pdf]
        permission: "Not-A-Key"
        generate_path: "/api/demo/reports"
        export_path: "/api/demo/reports/{id}/export"
  - name: foreign permission
    error: neither in adds_permissions nor consumes_permissions
    capabilities: |
      - kind: document-export
        formats: [pdf]
        permission: containers.manage
        generate_path: "/api/demo/reports"
        export_path: "/api/demo/reports/{id}/export"
  - name: backup map missing a key
    error: pages.edit_plan is required
    capabilities: |
      - kind: backup-row-actions
        source_kind: vm
        pages: {open: "/plugins/addon-demo", restore: "/plugins/addon-demo"}
        routes: {delete_run: "/api/demo/backups/{id}", delete_plan: "/api/demo/backup-plans/{id}"}
        permissions: {view: demo.view, manage: demo.backup.manage, delete: demo.backup.delete, restore: demo.restore.run}
  - name: backup map unknown key
    error: is not a known key
    capabilities: |
      - kind: backup-row-actions
        source_kind: vm
        pages: {open: "/plugins/addon-demo", restore: "/plugins/addon-demo", edit_plan: "/plugins/addon-demo", extra: "/plugins/addon-demo"}
        routes: {delete_run: "/api/demo/backups/{id}", delete_plan: "/api/demo/backup-plans/{id}"}
        permissions: {view: demo.view, manage: demo.backup.manage, delete: demo.backup.delete, restore: demo.restore.run}
  - name: backup route with the wrong method
    error: routes.delete_run
    capabilities: |
      - kind: backup-row-actions
        source_kind: vm
        pages: {open: "/plugins/addon-demo", restore: "/plugins/addon-demo", edit_plan: "/plugins/addon-demo"}
        routes: {delete_run: "/api/demo/private", delete_plan: "/api/demo/backup-plans/{id}"}
        permissions: {view: demo.view, manage: demo.backup.manage, delete: demo.backup.delete, restore: demo.restore.run}
  - name: backup permission not owned
    error: permissions.restore
    capabilities: |
      - kind: backup-row-actions
        source_kind: vm
        pages: {open: "/plugins/addon-demo", restore: "/plugins/addon-demo", edit_plan: "/plugins/addon-demo"}
        routes: {delete_run: "/api/demo/backups/{id}", delete_plan: "/api/demo/backup-plans/{id}"}
        permissions: {view: demo.view, manage: demo.backup.manage, delete: demo.backup.delete, restore: other.restore}
  - name: declared twice
    error: declared twice
    capabilities: |
      - kind: runbook-provider
        domain: vm
      - kind: runbook-provider
        domain: vm
  - name: runbook descriptors are accepted
    error: ""
    capabilities: |
      - kind: runbook-provider
        domain: vm
        i18n_ns: demo
        targets:
          - kind: vm
            label_key: runbook.targets.vm
            path: "/api/demo/machines"
            query: {env: "$env"}
            id: id
            name: [name]
            detail: [state]
        steps:
          - key: vm.start
            description_key: runbook.steps.start
            kind: action
            target: vm
            destructive: true
            permissions: [demo.manage]
            params:
              - {name: vm, type: target, target: vm}
              - {name: graceSeconds, type: int, min: 0, max: 3600}
            call:
              method: POST
              path: "/api/demo/machines/{vm}/start"
              body: [{json: graceSeconds, param: graceSeconds, type: int}]
          - key: vm.logs
            description_key: runbook.steps.logs
            kind: diagnostic
            target: vm
            permissions: [demo.view]
            params:
              - {name: vm, type: target, target: vm}
            call:
              method: GET
              path: "/api/demo/machines/{vm}/logs"
              query: {env: "$env", tail: "=150"}
              text: logs
  - name: runbook step route not declared
    error: is not a route this plugin declares
    capabilities: |
      - kind: runbook-provider
        domain: vm
        i18n_ns: demo
        targets:
          - {kind: vm, label_key: runbook.targets.vm, path: "/api/demo/machines", id: id, name: [name]}
        steps:
          - key: vm.start
            description_key: runbook.steps.start
            kind: action
            target: vm
            permissions: [demo.manage]
            params: [{name: vm, type: target, target: vm}]
            call: {method: POST, path: "/api/demo/machines/{vm}/reboot"}
  - name: runbook step permission not owned
    error: neither in adds_permissions nor consumes_permissions
    capabilities: |
      - kind: runbook-provider
        domain: vm
        i18n_ns: demo
        targets:
          - {kind: vm, label_key: runbook.targets.vm, path: "/api/demo/machines", id: id, name: [name]}
        steps:
          - key: vm.start
            description_key: runbook.steps.start
            kind: action
            target: vm
            permissions: [demo.manage, other.manage]
            params: [{name: vm, type: target, target: vm}]
            call: {method: POST, path: "/api/demo/machines/{vm}/start"}
  - name: runbook step key without the domain prefix
    error: must start with the domain
    capabilities: |
      - kind: runbook-provider
        domain: vm
        i18n_ns: demo
        targets:
          - {kind: vm, label_key: runbook.targets.vm, path: "/api/demo/machines", id: id, name: [name]}
        steps:
          - key: ct.start
            description_key: runbook.steps.start
            kind: action
            target: vm
            permissions: [demo.manage]
            params: [{name: vm, type: target, target: vm}]
            call: {method: POST, path: "/api/demo/machines/{vm}/start"}
  - name: runbook step param with an unknown type
    error: is not one of
    capabilities: |
      - kind: runbook-provider
        domain: vm
        i18n_ns: demo
        targets:
          - {kind: vm, label_key: runbook.targets.vm, path: "/api/demo/machines", id: id, name: [name]}
        steps:
          - key: vm.start
            description_key: runbook.steps.start
            kind: action
            target: vm
            permissions: [demo.manage]
            params: [{name: vm, type: target, target: vm}, {name: note, type: markdown}]
            call: {method: POST, path: "/api/demo/machines/{vm}/start"}
  - name: runbook diagnostic that is not a read
    error: a diagnostic is read-only
    capabilities: |
      - kind: runbook-provider
        domain: vm
        i18n_ns: demo
        targets:
          - {kind: vm, label_key: runbook.targets.vm, path: "/api/demo/machines", id: id, name: [name]}
        steps:
          - key: vm.start
            description_key: runbook.steps.start
            kind: diagnostic
            target: vm
            permissions: [demo.manage]
            params: [{name: vm, type: target, target: vm}]
            call: {method: POST, path: "/api/demo/machines/{vm}/start"}
  - name: runbook step omits the permission its route enforces
    error: which permissions does not list
    capabilities: |
      - kind: runbook-provider
        domain: vm
        i18n_ns: demo
        targets:
          - {kind: vm, label_key: runbook.targets.vm, path: "/api/demo/machines", id: id, name: [name]}
        steps:
          - key: vm.start
            description_key: runbook.steps.start
            kind: action
            target: vm
            permissions: [demo.view]
            params: [{name: vm, type: target, target: vm}]
            call: {method: POST, path: "/api/demo/machines/{vm}/start"}
  - name: runbook path placeholder names no param
    error: names no param
    capabilities: |
      - kind: runbook-provider
        domain: vm
        i18n_ns: demo
        targets:
          - {kind: vm, label_key: runbook.targets.vm, path: "/api/demo/machines", id: id, name: [name]}
        steps:
          - key: vm.start
            description_key: runbook.steps.start
            kind: action
            target: vm
            permissions: [demo.manage]
            params: [{name: vm, type: target, target: vm}]
            call: {method: POST, path: "/api/demo/machines/{machine}/start"}
  - name: runbook step target is not declared
    error: neither environment nor a kind under targets
    capabilities: |
      - kind: runbook-provider
        domain: vm
        i18n_ns: demo
        targets:
          - {kind: vm, label_key: runbook.targets.vm, path: "/api/demo/machines", id: id, name: [name]}
        steps:
          - key: vm.start
            description_key: runbook.steps.start
            kind: action
            target: pool
            permissions: [demo.manage]
            params: [{name: pool, type: target, target: pool}]
            call: {method: POST, path: "/api/demo/machines/{vm}/start"}
  - name: runbook target list route not declared
    error: is not a route this plugin declares
    capabilities: |
      - kind: runbook-provider
        domain: vm
        i18n_ns: demo
        targets:
          - {kind: vm, label_key: runbook.targets.vm, path: "/api/demo/elsewhere", id: id, name: [name]}
  - name: runbook target kind outside the domain
    error: must be vm or start with vm_
    capabilities: |
      - kind: runbook-provider
        domain: vm
        i18n_ns: demo
        targets:
          - {kind: container, label_key: runbook.targets.vm, path: "/api/demo/machines", id: id, name: [name]}
  - name: runbook steps without a namespace
    error: i18n_ns
    capabilities: |
      - kind: runbook-provider
        domain: vm
        targets:
          - {kind: vm, label_key: runbook.targets.vm, path: "/api/demo/machines", id: id, name: [name]}
        steps:
          - key: vm.start
            description_key: runbook.steps.start
            kind: action
            target: vm
            permissions: [demo.manage]
            params: [{name: vm, type: target, target: vm}]
            call: {method: POST, path: "/api/demo/machines/{vm}/start"}
  - name: runbook field from another kind
    error: does not apply to this kind
    capabilities: |
      - kind: estate-source
        metric: vms
        path: "/api/demo"
        environment_field: environmentId
        domain: vm
  - name: runbook target without a label key
    error: label_key
    capabilities: |
      - kind: runbook-provider
        domain: vm
        i18n_ns: demo
        targets:
          - {kind: vm, path: "/api/demo/machines", id: id, name: [name]}
  - name: runbook target label key is not an i18n key
    error: is not an i18n key
    capabilities: |
      - kind: runbook-provider
        domain: vm
        i18n_ns: demo
        targets:
          - {kind: vm, label_key: "Not A Key!", path: "/api/demo/machines", id: id, name: [name]}
  - name: runbook targets without a namespace
    error: i18n_ns
    capabilities: |
      - kind: runbook-provider
        domain: vm
        targets:
          - {kind: vm, label_key: runbook.targets.vm, path: "/api/demo/machines", id: id, name: [name]}
  - name: runbook target of a kind the host has never heard of is accepted
    error: ""
    capabilities: |
      - kind: runbook-provider
        domain: vm
        i18n_ns: demo
        targets:
          - {kind: vm_widget, label_key: runbook.targets.widget, path: "/api/demo/machines", id: id, name: [name]}
  - name: document export without its generate route
    error: generate_path is required
    capabilities: |
      - kind: document-export
        formats: [pdf]
        permission: compute.view
        export_path: "/api/demo/reports/{id}/export"
  - name: document export without its download route
    error: export_path is required
    capabilities: |
      - kind: document-export
        formats: [pdf]
        permission: compute.view
        generate_path: "/api/demo/reports"
  - name: document export generate route not declared
    error: generate_path
    capabilities: |
      - kind: document-export
        formats: [pdf]
        permission: compute.view
        generate_path: "/api/demo/elsewhere"
        export_path: "/api/demo/reports/{id}/export"
  - name: document export download route not declared
    error: export_path
    capabilities: |
      - kind: document-export
        formats: [pdf]
        permission: compute.view
        generate_path: "/api/demo/reports"
        export_path: "/api/demo/reports/{id}/download"
  - name: document export generate route with the wrong method
    error: generate_path
    capabilities: |
      - kind: document-export
        formats: [pdf]
        permission: compute.view
        generate_path: "/api/demo/machines"
        export_path: "/api/demo/reports/{id}/export"
  - name: picker source over a declared runbook target
    error: ""
    capabilities: |
      - kind: runbook-provider
        domain: vm
        i18n_ns: demo
        targets:
          - {kind: vm, label_key: runbook.targets.vm, path: "/api/demo/machines", query: {env: "$env"}, id: id, name: [name], detail: [state]}
      - kind: picker-source
        target: vm
  - name: picker source declared before its runbook provider
    error: ""
    capabilities: |
      - kind: picker-source
        target: vm
      - kind: runbook-provider
        domain: vm
        i18n_ns: demo
        targets:
          - {kind: vm, label_key: runbook.targets.vm, path: "/api/demo/machines", id: id, name: [name]}
  - name: picker source naming no runbook target
    error: is not a targets[].kind
    capabilities: |
      - kind: runbook-provider
        domain: vm
        i18n_ns: demo
        targets:
          - {kind: vm, label_key: runbook.targets.vm, path: "/api/demo/machines", id: id, name: [name]}
      - kind: picker-source
        target: vm_disk
  - name: picker source without any runbook provider
    error: is not a targets[].kind
    capabilities: |
      - kind: picker-source
        target: vm
  - name: picker source over a route without a permission
    error: declares no requires_permission
    capabilities: |
      - kind: runbook-provider
        domain: vm
        i18n_ns: demo
        targets:
          - {kind: vm, label_key: runbook.targets.vm, path: "/api/demo", id: id, name: [name]}
      - kind: picker-source
        target: vm
  - name: picker source with a malformed target
    error: must match
    capabilities: |
      - kind: picker-source
        target: "VM List"
  - name: picker source with a field of another kind
    error: does not apply
    capabilities: |
      - kind: picker-source
        target: vm
        path: "/api/demo/machines"
  - name: picker source declared twice
    error: declared twice
    capabilities: |
      - kind: runbook-provider
        domain: vm
        i18n_ns: demo
        targets:
          - {kind: vm, label_key: runbook.targets.vm, path: "/api/demo/machines", id: id, name: [name]}
      - kind: picker-source
        target: vm
      - kind: picker-source
        target: vm
  - name: workflow node alias over a listed node
    error: ""
    capabilities: |
      - kind: workflow-node-alias
        alias: demo-trigger
        node: demo-trigger
  - name: workflow node alias to a node the plugin does not list
    error: is not listed under contributes.nodes
    capabilities: |
      - kind: workflow-node-alias
        alias: demo-trigger
        node: other-node
  - name: workflow node alias that is a composite action
    error: must match
    capabilities: |
      - kind: workflow-node-alias
        alias: "plugin:addon-demo:demo-trigger"
        node: demo-trigger
  - name: workflow node alias without its node
    error: exactly one of node or channel_type
    capabilities: |
      - kind: workflow-node-alias
        alias: demo-trigger
  - name: workflow node alias claimed twice
    error: declared twice
    capabilities: |
      - kind: workflow-node-alias
        alias: demo-trigger
        node: demo-trigger
      - kind: workflow-node-alias
        alias: demo-trigger
        node: demo-trigger
  - name: email channel over the plugin's own channel type
    error: ""
    capabilities: |
      - kind: email-channel
        channel_type: pigeon
  - name: email channel for a channel type the plugin does not mount
    error: is not the key of a contributes.forms entry
    capabilities: |
      - kind: email-channel
        channel_type: raven
  - name: email channel naming a form of another resource
    error: is not the key of a contributes.forms entry
    capabilities: |
      - kind: email-channel
        channel_type: carrier
  - name: email channel with a malformed channel type
    error: must match
    capabilities: |
      - kind: email-channel
        channel_type: "Pigeon Mail"
  - name: email channel without its channel type
    error: field channel_type is required
    capabilities: |
      - kind: email-channel
  - name: email channel with a field of another kind
    error: does not apply
    capabilities: |
      - kind: email-channel
        channel_type: pigeon
        node: demo-trigger
  - name: email channel declared twice
    error: declared twice
    capabilities: |
      - kind: email-channel
        channel_type: pigeon
      - kind: email-channel
        channel_type: pigeon
  - name: workflow node alias to the plugin's own channel type
    error: ""
    capabilities: |
      - kind: workflow-node-alias
        alias: send-pigeon
        channel_type: pigeon
  - name: workflow node alias to a channel type the plugin does not mount
    error: is not the key of a contributes.forms entry
    capabilities: |
      - kind: workflow-node-alias
        alias: send-raven
        channel_type: raven
  - name: workflow node alias naming both a node and a channel type
    error: exactly one of node or channel_type
    capabilities: |
      - kind: workflow-node-alias
        alias: send-pigeon
        node: demo-trigger
        channel_type: pigeon
  - name: workflow node alias claimed once as a node and once as a channel
    error: declared twice
    capabilities: |
      - kind: workflow-node-alias
        alias: send-pigeon
        node: demo-trigger
      - kind: workflow-node-alias
        alias: send-pigeon
        channel_type: pigeon
  - name: runbook attach declared
    error: ""
    capabilities: |
      - kind: runbook-provider
        domain: vm
        i18n_ns: demo
        targets:
          - kind: vm
            label_key: runbook.targets.vm
            path: "/api/demo/machines"
            id: id
            name: [name]
            attach: {kind: vm, label_key: runbook.attach.vm}

  - name: runbook attach with a subject target of its own
    error: ""
    capabilities: |
      - kind: runbook-provider
        domain: vm
        i18n_ns: demo
        targets:
          - kind: vm
            label_key: runbook.targets.vm
            path: "/api/demo/machines"
            id: id
            name: [name]
            attach: {kind: vm, label_key: runbook.attach.vm, subject_targets: [vm]}

  - name: runbook attach subject target not declared
    error: "is not a kind under targets"
    capabilities: |
      - kind: runbook-provider
        domain: vm
        i18n_ns: demo
        targets:
          - kind: vm
            label_key: runbook.targets.vm
            path: "/api/demo/machines"
            id: id
            name: [name]
            attach: {kind: vm, label_key: runbook.attach.vm, subject_targets: [pod]}

  - name: runbook attach kind outside the domain
    error: "must be vm or start with vm_"
    capabilities: |
      - kind: runbook-provider
        domain: vm
        i18n_ns: demo
        targets:
          - kind: vm
            label_key: runbook.targets.vm
            path: "/api/demo/machines"
            id: id
            name: [name]
            attach: {kind: pod, label_key: runbook.attach.vm}

  - name: runbook attach kind owned by the host
    error: "belongs to the host"
    capabilities: |
      - kind: runbook-provider
        domain: stack
        i18n_ns: demo
        targets:
          - kind: stack
            label_key: runbook.targets.vm
            path: "/api/demo/machines"
            id: id
            name: [name]
            attach: {kind: stack, label_key: runbook.attach.vm}

  - name: runbook attach label_key malformed
