# plugin-catalog v2 (breaking against v1). Written by scripts/development/catalog_entry.py,
# read by modules/appstore/plugins (local_catalog.go, remote_catalog.go).
contract: plugin-catalog
version: 2
supersedes: 1
entry:
  versions:
    meaning: "stable releases only; a host that does not know prerelease_versions reads this list alone, so it can never rank a prerelease first or install one"
    max_entries: 1
    meaning_of_first: "versions[0] is the newest stable release, never what this host installs; a host reads its channel to choose"
    may_be_empty: "yes, for a plugin that has published only a prerelease; an earlier host then skips the entry"
    row_fields: [version, build, download_url, min_mcharbor, signature]
    version_syntax: "MAJOR.MINOR.PATCH[-suffix][+meta], parsed strictly; a row that does not parse is refused by the reader"
  prerelease_versions:
    meaning: "prerelease rows under a key earlier hosts ignore; read only by a host that knows channels, which offers a row to a prerelease host or to a plugin whose effective setting is on"
    max_entries: 1
    order: "newest first; a prerelease is kept only while it is newer than the newest stable"
    row_fields: [version, build, download_url, min_mcharbor, signature]
    readers_refuse: "a row that is not a prerelease or does not parse"
  min_mcharbor:
    syntax: "MAJOR.MINOR.PATCH[-suffix]; the suffix is kept as written, build metadata is refused"
    prerelease_rule: "no floor constraint is needed for old hosts, because they never read prerelease_versions; a channel-aware host enforces the floor on every row"
writer:
  merges_with_existing: true
  reads_existing: "versions and prerelease_versions both, so an entry an earlier writer left with a prerelease inside versions is rewritten into the split"
  refuses:
    - "a version or floor that does not parse"
    - "an existing entry file that is not valid JSON"
    - "an incoming row older than the newest of its kind already in the catalog"
  index: "build-plugin-catalog-index.sh keeps the same split in index.json and orders rows with catalog_entry.compare"
  line_endings: LF
  download_url: "https; a file:// URL is never published (plugin-catalog-publishing)"
