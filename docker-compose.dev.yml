services:
  backend:
    image: golang:1.26.4-alpine
    working_dir: /app
    ports:
      - "8705:8705"
      # Plain HTTP redirect listener (recovery path).
      - "8080:8080"
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro
      - ./src/backend:/app
      - ./VERSION:/app/VERSION:ro
      - go-cache:/root/go
      - mcharbor-data:/app/data
      - ${MCHARBOR_LOCAL_BACKUP_PATH:-./mnt/backup}:/mnt/backup
    environment:
      - PORT=8705
      - AUTH_DISABLE=true
      - STATIC_DIR=/app/static
      # HTTPS defaults — match docker-compose.yml so the dev loop
      # exercises the same code path as production.
      - TLS_ENABLED=true
      - TLS_MIN_VERSION=1.3
      - HTTP_REDIRECT_ADDR=:8080
      - FORCE_AGENT_TLS=true
      # Trusted reverse-proxy CIDRs for API-key client-IP attribution.
      # Empty means forwarding headers are ignored, which is what a direct
      # dev loop wants.
      - MCHARBOR_TRUSTED_PROXY_CIDRS=${MCHARBOR_TRUSTED_PROXY_CIDRS:-}
    command: ["sh", "-c", "go mod tidy && go run ./main.go"]

  frontend:
    image: node:26-alpine
    working_dir: /app
    ports:
      - "8173:8173"
    volumes:
      - ./src/frontend:/app
      - frontend-modules:/app/node_modules
    command: ["sh", "-c", "npm install && npm run dev -- --host"]

  agent:
    profiles: ["agent"]
    image: ${MCHARBOR_AGENT_IMAGE:-ghcr.io/therealmcsparrow/mcharbor-agent}:${MCHARBOR_AGENT_TAG:-latest}
    restart: unless-stopped
    environment:
      # Dev backend now serves HTTPS on :8705 (self-signed). The agent
      # dials wss:// and skips cert verification (MCHARBOR_INSECURE=true
      # below) so the dev loop doesn't have to install the cert.
      - MCHARBOR_URL=${MCHARBOR_URL:-wss://host.docker.internal:8705}
      # Belt-and-braces: even if MCHARBOR_URL is left empty, the agent
      # still upgrades ws:// to wss://.
      - MCHARBOR_FORCE_TLS=1
      - MCHARBOR_AGENT_TOKEN=${MCHARBOR_AGENT_TOKEN:-}
      - DOCKER_HOST=${MCHARBOR_AGENT_DOCKER_HOST:-unix:///var/run/docker.sock}
      - LOG_LEVEL=${MCHARBOR_AGENT_LOG_LEVEL:-info}
      # Dev backend uses a self-signed cert, so the agent must skip
      # cert verification. Override MCHARBOR_AGENT_INSECURE=false in
      # your shell if you've mounted a real cert into the backend.
      - MCHARBOR_INSECURE=${MCHARBOR_AGENT_INSECURE:-true}
    ports:
      # The dev agent listens on :8788 for the host's push transfers.
      - "8788:8788"
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
      - mcharbor-agent-data:/var/lib/mcharbor-agent

volumes:
  mcharbor-agent-data:
  mcharbor-data:
  go-cache:
  frontend-modules:
